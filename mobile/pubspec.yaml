name: makolo_mobile
description: Makolo installed local-first client foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 7.3.1
  drift: 2.35.0
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0
  go_router: 18.0.1
  http: 1.6.0
  path_provider: 2.1.6

dev_dependencies:
  build_runner: 2.16.1
  drift_dev: 2.35.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/makolo-mark-violet.svg
    - assets/brand/makolo-mark-white.svg
