name: makolo_mobile
description: Makolo installed local-first client foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: 0.12.1
  connectivity_plus: 7.3.1
  dio: 5.11.1
  drift: 2.35.0
  drift_flutter: 0.3.1
  file_picker: 13.1.0
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter_local_notifications: 22.3.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0
  geolocator: 14.0.3
  go_router: 18.0.1
  home_widget: 0.10.0
  image_picker: 1.2.3
  intl: 0.20.3
  json_annotation: 4.12.0
  local_auth: 3.0.2
  maplibre_gl: 0.27.1
  mobile_scanner: 7.4.2
  package_info_plus: 10.2.1
  path_provider: 2.1.6
  pdfrx: 2.6.5
  permission_handler: 13.0.2
  pretty_qr_code: 3.6.0
  sentry_flutter: 9.30.1
  share_plus: 13.3.0
  url_launcher: 6.3.2
  video_player: 2.14.0
  workmanager: 0.10.10

dev_dependencies:
  build_runner: 2.16.1
  drift_dev: 2.35.0
  flutter_lints: 6.0.0
  json_serializable: 6.14.1
  sqlite3: 3.6.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/makolo-mark-violet.svg
    - assets/brand/makolo-mark-white.svg
    - assets/brand/makolo-logo-violet.svg
    - assets/brand/makolo-logo-white.svg
