targets:
  $default:
    builders:
      makolo_mobile:me_format_probe:
        generate_for:
          - lib/features/me/me_screen.dart
          - lib/features/me/me_selector.dart
          - test/me_mature_test.dart

builders:
  me_format_probe:
    import: "package:makolo_mobile/me_format_probe.dart"
    builder_factories: ["meFormatProbe"]
    build_extensions: {".dart": [".meprobe"]}
    auto_apply: root_package
    build_to: cache
