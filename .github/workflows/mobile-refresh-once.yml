name: Mobile temporary source refresh

on:
  push:
    branches:
      - mobile/production-infrastructure-foundation
    paths:
      - ".github/workflows/mobile-refresh-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: mobile/production-infrastructure-foundation
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Refresh lockfile
        run: flutter pub get
      - name: Generate code for formatting context
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit lockfile and formatter output
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/pubspec.lock mobile/lib mobile/test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/pubspec.lock mobile/lib mobile/test
          git commit -m "chore(mobile): refresh lockfile and formatting"
          git push origin HEAD:mobile/production-infrastructure-foundation
