name: AR format diagnostic

on:
  push:
    branches:
      - mobile/ar-access-real-world-action

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
      - name: Print canonical Dart formatted files
        shell: bash
        run: |
          cd mobile
          files=(
            lib/features/access/access_repository.dart
            lib/features/access/access_selector.dart
            lib/features/access/access_detail_screen.dart
            lib/features/access/access_credential_screen.dart
            lib/features/day_of/day_of_repository.dart
            lib/features/day_of/day_of_selector.dart
            lib/features/day_of/day_of_screen.dart
            test/ar_access_real_world_action_test.dart
          )
          dart format "${files[@]}"
          for file in "${files[@]}"; do
            echo "AR_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "AR_FORMAT_END:$file"
          done
