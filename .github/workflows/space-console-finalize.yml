name: Space Console finalization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/space-console'
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-e2e-only-secret-key-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cut empty-Space fixture over to canonical creation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('core/management/commands/prepare_e2e.py')
          text = path.read_text()
          import_line = 'from organizations.models import Organization, OrganizationMembership, OrganizationRole, OrganizationVerificationStatus\n'
          replacement_import = import_line + 'from organizations.services import create_organization\n'
          if 'from organizations.services import create_organization\n' not in text:
              if import_line not in text:
                  raise SystemExit('Expected organizations import not found')
              text = text.replace(import_line, replacement_import, 1)

          old = '''        empty_org = Organization.objects.create(name="Makolo E2E Nouvelle Organisation", description="Organisation sans événement pour tester les états vides.", public_profile=True, verification_status=OrganizationVerificationStatus.VERIFIED, created_by=users["new_organizer"])
          self._membership(empty_org, users["new_organizer"], OrganizationRole.OWNER)
          '''
          new = '''        empty_org = create_organization(
              creator=users["new_organizer"],
              name="Makolo E2E Nouvelle Organisation",
              description="Espace sans activité pour tester les états vides.",
              public_profile=True,
              verification_status=OrganizationVerificationStatus.VERIFIED,
          )
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected empty Space fixture block not found')
          path.write_text(text)
          PY

      - name: Install dependencies and build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci
          npm run build

      - name: Install Chromium
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          npx playwright install --with-deps chromium

      - name: Refresh only the intentional Space Console snapshot and verify both remaining scenarios
        run: |
          bash scripts/run-e2e.sh e2e/specs/organizer.spec.mjs e2e/specs/visual.spec.mjs \
            --project=chromium-desktop \
            --grep 'new organizer empty state|representative light desktop surfaces' \
            --update-snapshots

      - name: Commit canonical fixture and visual baseline, then remove helper
        shell: bash
        run: |
          git rm .github/workflows/space-console-finalize.yml
          git add core/management/commands/prepare_e2e.py e2e/specs/visual.spec.mjs-snapshots/organizer-dashboard-light-desktop-chromium-desktop-linux.png
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: finalize canonical Space Console E2E'
          git push origin "HEAD:${{ github.head_ref }}"
