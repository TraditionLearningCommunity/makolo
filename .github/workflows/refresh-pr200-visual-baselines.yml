name: Refresh PR200 visual baselines

on:
  push:
    branches:
      - fix/finalize-discovery-presentation

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-discovery-presentation
      - name: Download validated CI diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33972161452 --name playwright-e2e-diagnostics --dir /tmp/pr200-diag
      - name: Install exactly the reviewed baselines
        shell: bash
        run: |
          set -euo pipefail
          desktop="$(find /tmp/pr200-diag -type f -name 'discovery-light-desktop-actual.png' -print -quit)"
          mobile="$(find /tmp/pr200-diag -type f -name 'discovery-light-mobile-actual.png' -print -quit)"
          dashboard="$(find /tmp/pr200-diag -type f -name 'participant-dashboard-dark-desktop-actual.png' -print -quit)"
          test -n "$desktop" && test -n "$mobile" && test -n "$dashboard"
          cp "$desktop" e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png
          cp "$mobile" e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png
          cp "$dashboard" e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-dark-desktop-chromium-desktop-linux.png
          git rm .github/workflows/refresh-pr200-visual-baselines.yml
      - name: Verify exact change scope
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            '.github/workflows/refresh-pr200-visual-baselines.yml' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-dark-desktop-chromium-desktop-linux.png' | sort)"
          actual="$(git diff --name-only HEAD | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Commit reviewed baselines and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: refresh reviewed Discovery visual baselines'
          git push origin HEAD:fix/finalize-discovery-presentation
