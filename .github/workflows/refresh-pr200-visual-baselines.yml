name: Refresh PR200 visual baselines

on:
  push:
    branches:
      - fix/finalize-discovery-presentation

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-discovery-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          npm ci
      - name: Build and validate frontend
        run: |
          npm run build
          git diff --exit-code -- package-lock.json static/dist
          npm run check:runtime-deps
          python manage.py makemigrations --check --dry-run
      - name: Install Chromium
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt-mirrors.txt >/dev/null
          npx playwright install --with-deps chromium
      - name: Refresh visual snapshots
        shell: bash
        run: |
          source scripts/e2e-env.sh
          bash scripts/prepare-e2e.sh
          E2E_SKIP_PREP=1 npm run test:e2e:update-snapshots
      - name: Verify exact snapshot scope
        shell: bash
        run: |
          expected="$(printf '%s\n' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-dark-desktop-chromium-desktop-linux.png' | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
      - name: Commit intentional baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/specs/visual.spec.mjs-snapshots
          git commit -m 'test: refresh intentional Discovery visual baselines'
          git push origin HEAD:fix/finalize-discovery-presentation
