name: Q4 ambiguous policy safety hardening

on:
  push:
    branches:
      - capital/q4-trusted-reuse-hardening
    paths:
      - .github/workflows/q4-policy-ambiguity-fix.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capital/q4-trusted-reuse-hardening
      - name: Return UNKNOWN for multiple exact policies
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("services/trusted_reuse.py")
          text = path.read_text()
          needle = '''    if not exact_policies:\n        return _decision(\n            assessment=assessment,\n            candidate=candidate,\n            code=TrustedReuseDecisionCode.NOT_ACCEPTABLE,\n            reasons=(TrustedReuseReasonCode.KIND_MISMATCH, TrustedReuseReasonCode.CURRENT_REQUIREMENT),\n            observed_at=observed_at,\n        )\n    policy = exact_policies[0]\n'''
          replacement = '''    if not exact_policies:\n        return _decision(\n            assessment=assessment,\n            candidate=candidate,\n            code=TrustedReuseDecisionCode.NOT_ACCEPTABLE,\n            reasons=(TrustedReuseReasonCode.KIND_MISMATCH, TrustedReuseReasonCode.CURRENT_REQUIREMENT),\n            observed_at=observed_at,\n        )\n    if len(exact_policies) != 1:\n        return _decision(\n            assessment=assessment,\n            candidate=candidate,\n            code=TrustedReuseDecisionCode.UNKNOWN,\n            reasons=(TrustedReuseReasonCode.POLICY_AMBIGUOUS, TrustedReuseReasonCode.CURRENT_REQUIREMENT),\n            observed_at=observed_at,\n        )\n    policy = exact_policies[0]\n'''
          if needle not in text:
              raise SystemExit("Expected policy selection block not found")
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit ambiguity hardening
        run: |
          git config user.name "Gilbert243"
          git config user.email "gilbert.bemwiz@fitforpurpose.tech"
          git add services/trusted_reuse.py
          git commit -m "Q4: refuse ambiguous exact reuse policies"
          git push origin HEAD:capital/q4-trusted-reuse-hardening
