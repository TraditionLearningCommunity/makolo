name: M8-B repair reviewed nearby baselines

on:
  push:
    branches:
      - m8/discover-possibility-experience

permissions:
  actions: read
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'install reviewed nearby PNG baselines') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out M8-B head
        uses: actions/checkout@v4
        with:
          ref: m8/discover-possibility-experience
          fetch-depth: 0

      - name: Download reviewed E2E diagnostics artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-e2e-diagnostics
          path: .reviewed-e2e
          repository: TraditionLearningCommunity/makolo
          run-id: 34502993760
          github-token: ${{ github.token }}

      - name: Install only reviewed nearby PNG baselines
        shell: bash
        run: |
          set -euo pipefail
          light=$(find .reviewed-e2e -type f -name 'discovery-nearby-light-desktop-actual.png' -print -quit)
          dark=$(find .reviewed-e2e -type f -name 'discovery-nearby-dark-desktop-actual.png' -print -quit)
          test -n "$light"
          test -n "$dark"
          python - "$light" "$dark" <<'PY'
          import struct
          import sys
          for path in sys.argv[1:]:
              with open(path, 'rb') as handle:
                  header = handle.read(24)
              assert header[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', header[16:24])
              assert width == 1440, (path, width, height)
              assert height in {3093, 3277}, (path, width, height)
          PY
          cp "$light" e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-light-desktop-chromium-desktop-linux.png
          cp "$dark" e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-dark-desktop-chromium-desktop-linux.png

      - name: Verify exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-dark-desktop-chromium-desktop-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-light-desktop-chromium-desktop-linux.png' | sort)
          actual=$(git diff --name-only | sort)
          printf 'Expected changes:\n%s\nActual changes:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Commit reviewed PNGs and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git add \
            e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-dark-desktop-chromium-desktop-linux.png \
            e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-light-desktop-chromium-desktop-linux.png
          git rm .github/workflows/m8b-repair-nearby-baselines.yml
          expected=$(printf '%s\n' \
            '.github/workflows/m8b-repair-nearby-baselines.yml' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-dark-desktop-chromium-desktop-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-light-desktop-chromium-desktop-linux.png' | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M8-B: install reviewed nearby PNG baselines'
          git push origin HEAD:m8/discover-possibility-experience
