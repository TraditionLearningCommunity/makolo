name: Now Presentation Contract

on:
  pull_request:
    paths:
      - "mobile/lib/features/now/**"
      - "mobile/lib/presentation/contracts/now_presentation.dart"
      - "mobile/lib/dev/scenarios/now_scenarios.dart"
      - "mobile/test/now_gallery_scenarios_test.dart"
      - ".github/workflows/now-presentation-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: now-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  now-scenario-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate owner DTO and Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify generated-code policy
        run: git diff --exit-code -- lib test
      - name: Format check for Now scenario sources
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/features/now
          lib/presentation/contracts/now_presentation.dart
          lib/dev/scenarios/now_scenarios.dart
          test/now_gallery_scenarios_test.dart
      - name: Verify Now topologies, accessibility and handoffs
        run: flutter test test/now_gallery_scenarios_test.dart
