name: P3 checkpoint validation

on:
  push:
    branches:
      - sharing/p3-journey-reuse

concurrency:
  group: p3-checkpoint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: p3-checkpoint-django-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Verify committed frontend artifacts
        run: |
          git diff --exit-code -- package-lock.json static/dist
          git status --porcelain -- package-lock.json static/dist | tee /tmp/frontend-status.txt
          test ! -s /tmp/frontend-status.txt
      - name: Reject runtime dependency regressions
        run: npm run check:runtime-deps
      - name: Run Django checks and migration check
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Check production security settings
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "p3-checkpoint-production-security-only-long-random-secret-not-real"
          DJANGO_ALLOWED_HOSTS: makolo.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://makolo.example.test
          MAKOLO_PUBLIC_BASE_URL: https://makolo.example.test
          PAYMENTS_WEBHOOK_SECRET: p3-checkpoint-webhook-not-real
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Collect and validate static files
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "p3-checkpoint-staticfiles-only-long-random-secret-not-real"
          DJANGO_ALLOWED_HOSTS: makolo.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://makolo.example.test
          MAKOLO_PUBLIC_BASE_URL: https://makolo.example.test
          PAYMENTS_WEBHOOK_SECRET: p3-checkpoint-webhook-not-real
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: |
          rm -rf staticfiles
          python manage.py collectstatic --noinput
          python scripts/validate_static_manifest.py
      - name: Run full Django test suite
        run: python manage.py test

  postgresql-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_p3_ci
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-p3-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_p3_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: p3-checkpoint-postgresql-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_p3_ci
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-p3-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check and migrate PostgreSQL
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run P3 and directly affected PostgreSQL tests
        run: >-
          python manage.py test
          sharing.test_journey_reuse
          sharing.test_journey_reuse_concurrency
          journeys.tests
          services.tests
          questionnaires.tests
          opportunities.tests

  beta-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: p3-checkpoint-beta-seed-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DB_PATH: /tmp/makolo-p3-beta-seed.sqlite3
      MAKOLO_DEMO_PASSWORD: p3-checkpoint-beta-password-not-production
      BETA_AS_OF: "2026-08-21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build and validate fresh beta seed
        run: |
          rm -f "$DJANGO_DB_PATH"
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py seed_makolo_demo --scale beta --as-of "$BETA_AS_OF"
          python manage.py validate_makolo_demo --as-of "$BETA_AS_OF"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-p3-e2e-only-secret-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-p3-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-p3-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-p3-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Install frontend and browser dependencies
        run: |
          npm ci
          npm run build
          npm run check:runtime-deps
          npx playwright install --with-deps chromium firefox
      - name: Verify migrations before E2E
        run: python manage.py makemigrations --check --dry-run
      - name: Prepare deterministic E2E environment
        run: bash scripts/prepare-e2e.sh
      - name: Run end-to-end product validation
        env:
          E2E_SKIP_PREP: "1"
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p3-playwright-e2e-diagnostics
          path: |
            playwright-report
            test-results/playwright
            /tmp/makolo-e2e-server.log
          if-no-files-found: ignore
          retention-days: 5
