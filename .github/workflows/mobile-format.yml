name: Mobile Format

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Feature branch to format. main is forbidden."
        required: true
        type: string

concurrency:
  group: mobile-format-${{ inputs.target_ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target branch
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_REF" == "main" || -z "$TARGET_REF" ]]; then
            echo "Mobile Format only accepts a non-main feature branch." >&2
            exit 2
          fi
          git check-ref-format --branch "$TARGET_REF" >/dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Format Dart sources
        working-directory: mobile
        run: bash tool/dart_format.sh write

      - name: Verify canonical format
        working-directory: mobile
        run: bash tool/dart_format.sh check

      - name: Commit formatting when needed
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/lib mobile/test; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git commit -m "Format mobile Dart sources"
          git push origin "HEAD:$TARGET_REF"
