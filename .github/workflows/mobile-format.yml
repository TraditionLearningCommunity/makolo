name: Mobile Format

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Feature branch to format. main is forbidden."
        required: true
        type: string

concurrency:
  group: mobile-format-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target branch
        env:
          TARGET_REF: ${{ inputs.target_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_REF" == "main" || -z "$TARGET_REF" ]]; then
            echo "Mobile Format only accepts a non-main feature branch." >&2
            exit 2
          fi
          git check-ref-format --branch "$TARGET_REF" >/dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Format Dart sources
        working-directory: mobile
        run: bash tool/dart_format.sh write

      - name: Verify canonical format
        working-directory: mobile
        run: bash tool/dart_format.sh check

      - name: Commit formatting when needed
        env:
          TARGET_REF: ${{ inputs.target_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Run format against a fresh remote head on every retry. Another
          # contributor may commit while the formatter works. Never force push.
          for attempt in 1 2 3 4; do
            git fetch origin "$TARGET_REF"
            git reset --hard "origin/$TARGET_REF"
            (cd mobile && bash tool/dart_format.sh write && bash tool/dart_format.sh check)
            if git diff --quiet -- mobile/lib mobile/test; then
              echo "Canonical formatting is current."
              exit 0
            fi
            git add mobile/lib mobile/test
            git commit -m "Format mobile Dart sources"
            if git push origin "HEAD:$TARGET_REF"; then
              exit 0
            fi
            echo "Branch advanced during formatting; retrying from latest remote head."
          done
          exit 1
