name: Q4 sync frontend artifacts

on:
  push:
    branches:
      - capital/q4-trusted-reuse-hardening

permissions:
  contents: write

concurrency:
  group: q4-sync-frontend-artifacts
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capital/q4-trusted-reuse-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect generated changes
        run: git status --short -- package-lock.json static/dist
      - name: Commit generated frontend artifacts only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json static/dist; then
            echo "Frontend artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json static/dist
          git commit -m "Q4: synchronize compiled frontend artifacts"
          git push origin HEAD:capital/q4-trusted-reuse-hardening
