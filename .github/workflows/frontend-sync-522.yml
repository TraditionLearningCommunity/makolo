name: Rebuild checked-in frontend assets for PR 522

on:
  push:
    branches: [fix/discover-a-continuation-context-20261014]
    paths:
      - ".github/workflows/frontend-sync-522.yml"

concurrency:
  group: frontend-sync-pr-522
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/discover-a-continuation-context-20261014
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build from committed lockfile
        run: |
          npm ci
          npm run build
          git diff --exit-code -- package-lock.json
      - name: Commit synchronized CSS and JavaScript, remove one-shot workflow
        env:
          TARGET_REF: fix/discover-a-continuation-context-20261014
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/dist
          git rm .github/workflows/frontend-sync-522.yml
          git commit -m "build(frontend): synchronize generated assets for PR 522"
          git push origin "HEAD:$TARGET_REF"
