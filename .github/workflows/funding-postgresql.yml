name: Funding PostgreSQL

on:
  # Explicit full gate for pre-merge / operational verification.
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "*.md"
      - "frontend/**"
      - "static/**"
      - ".github/workflows/mobile-*.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "*.md"
      - "frontend/**"
      - "static/**"
      - ".github/workflows/mobile-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub's PR paths evaluation is capped at 300 changed files. Resolve the
  # complete diff ourselves before allocating a PostgreSQL runner.
  scope:
    runs-on: ubuntu-latest
    outputs:
      run_suite: ${{ steps.changed.outputs.run_suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Resolve Funding impact from complete change set
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="$BASE_SHA...$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          # On any diff error, preserve the full safety gate.
          if ! git diff --name-only "$range" > /tmp/funding-changed.txt; then
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_suite=false
          while IFS= read -r file; do
            case "$file" in
              funding/*|payments/*|activities/*|accounts/*|organizations/*|authorization/*|subscriptions/*|commerce/*|discovery/*|core/*|social/*|topics/*|geography/*|config/*|templates/*|test_support/*|scripts/*|requirements.txt|requirements-agents.txt|manage.py|.github/workflows/funding-postgresql.yml)
                run_suite=true
                break
                ;;
            esac
          done < /tmp/funding-changed.txt
          echo "run_suite=$run_suite" >> "$GITHUB_OUTPUT"
          echo "Funding PostgreSQL impact: $run_suite"

  funding-postgresql:
    needs: scope
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft == false) && needs.scope.outputs.run_suite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_ci_funding
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_ci_funding"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-postgresql-funding-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_ci_funding
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check and migrate PostgreSQL
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Funding PostgreSQL contracts and concurrency
        run: >-
          python manage.py test
          funding.tests
          funding.test_views
          funding.test_discovery
          funding.test_concurrency
