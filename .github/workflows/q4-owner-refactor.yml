name: Q4 owner boundary refactor

on:
  push:
    branches:
      - capital/q4-trusted-reuse-hardening

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q4-owner-refactor-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capital/q4-trusted-reuse-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply owner refactor
        run: python .github/q4_owner_refactor.py
      - name: Generate and validate migrations
        run: |
          python -m pip install -r requirements.txt
          python manage.py makemigrations opportunities services --noinput
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test requirements.tests opportunities.test_q4_trusted_reuse_policy services.test_q4_trusted_reuse
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Q4: align Trusted Reuse persistence with domain owners"
          git push origin HEAD:capital/q4-trusted-reuse-hardening
