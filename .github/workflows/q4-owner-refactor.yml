name: Q4 owner boundary refactor

on:
  push:
    branches:
      - capital/q4-trusted-reuse-hardening

permissions:
  contents: write

concurrency:
  group: q4-owner-boundary-refactor
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q4-owner-refactor-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capital/q4-trusted-reuse-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Refactor persistence to domain owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Horizontal Requirements remains dependency-free and persistence-free.
          p = Path('requirements/trusted_reuse.py')
          text = p.read_text()
          marker = 'class TrustedReuseDecisionCode(str, Enum):\n'
          source_enum = '''class RequirementReuseSource(str, Enum):\n    LIBRARY = "library"\n    JOURNEY_ARTIFACT = "journey_artifact"\n    PROOF = "proof"\n\n\n'''
          if 'class RequirementReuseSource(str, Enum):' not in text:
              text = text.replace(marker, source_enum + marker)
          p.write_text(text)

          Path('requirements/apps.py').write_text('''from django.apps import AppConfig\n\n\nclass RequirementsConfig(AppConfig):\n    default_auto_field = "django.db.models.BigAutoField"\n    name = "requirements"\n    verbose_name = "Requirements"\n''')

          for name in ['requirements/models.py', 'requirements/admin.py', 'requirements/signals.py',
                       'requirements/migrations/0001_trusted_reuse_policy.py',
                       'requirements/migrations/0002_trusted_reuse_application.py',
                       'requirements/migrations/__init__.py']:
              path = Path(name)
              if path.exists():
                  path.unlink()
          migdir = Path('requirements/migrations')
          if migdir.exists() and not any(migdir.iterdir()):
              migdir.rmdir()

          # Policy belongs to Opportunities because it interprets an OpportunityRequirement.
          p = Path('opportunities/models.py')
          text = p.read_text()
          if 'from requirements.trusted_reuse import RequirementReuseSource' not in text:
              text = text.replace('from geography.validators import validate_timezone_name\n', 'from geography.validators import validate_timezone_name\nfrom requirements.trusted_reuse import RequirementReuseSource\n')
          policy_code = r'''

class RequirementReusePolicyQuerySet(models.QuerySet):
    def delete(self):
        if self.filter(requirement__revision__published_at__isnull=False).exists():
            raise ValidationError("La policy d’un Requirement publié ne peut pas être supprimée.")
        return super().delete()


class RequirementReusePolicy(models.Model):
    """Explicit, version-bound Trusted Reuse policy for one OpportunityRequirement."""

    id = models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)
    requirement = models.ForeignKey(
        OpportunityRequirement,
        on_delete=models.CASCADE,
        related_name="reuse_policies",
    )
    key = models.SlugField(max_length=80)
    source_type = models.CharField(
        max_length=24,
        choices=[
            (RequirementReuseSource.LIBRARY.value, "Ma Bibliothèque"),
            (RequirementReuseSource.JOURNEY_ARTIFACT.value, "JourneyArtifact historique"),
            (RequirementReuseSource.PROOF.value, "Proof Trust"),
        ],
    )
    # Exact canonical values. The Services adapter validates them against the
    # current Action Memory candidate; no title/fuzzy matching is permitted.
    artifact_kind = models.CharField(max_length=32, blank=True)
    proof_type = models.CharField(max_length=32, blank=True)
    require_not_expired = models.BooleanField(default=True)
    max_age_days = models.PositiveIntegerField(null=True, blank=True)
    allow_sensitive_with_confirmation = models.BooleanField(default=False)
    allow_restricted_with_confirmation = models.BooleanField(default=False)
    human_review_required = models.BooleanField(default=True)
    created_at = models.DateTimeField(auto_now_add=True)

    objects = RequirementReusePolicyQuerySet.as_manager()

    class Meta:
        ordering = ["requirement", "key", "created_at", "id"]
        constraints = [
            models.UniqueConstraint(fields=["requirement", "key"], name="opp_req_reuse_policy_key_unique"),
        ]
        indexes = [
            models.Index(fields=["requirement", "source_type"], name="opp_req_reuse_policy_src_idx"),
        ]

    def clean(self):
        super().clean()
        errors = {}
        is_proof = self.source_type == RequirementReuseSource.PROOF.value
        if is_proof:
            if not self.proof_type:
                errors["proof_type"] = "Une policy Proof doit déclarer un ProofType exact."
            if self.artifact_kind:
                errors["artifact_kind"] = "Une policy Proof ne porte pas de JourneyArtifactKind."
        else:
            if not self.artifact_kind:
                errors["artifact_kind"] = "Une policy documentaire doit déclarer un JourneyArtifactKind exact."
            if self.proof_type:
                errors["proof_type"] = "Une policy documentaire ne porte pas de ProofType."
        if self.max_age_days is not None and self.max_age_days < 1:
            errors["max_age_days"] = "La fenêtre de fraîcheur doit être d’au moins un jour."
        if self.requirement_id and self.requirement.revision.published_at is not None:
            errors["requirement"] = "La policy d’un Requirement publié est immuable."
        if errors:
            raise ValidationError(errors)

    def save(self, *args, **kwargs):
        if self.pk and not self._state.adding:
            raise ValidationError("Une policy Trusted Reuse est immuable ; versionnez le Requirement.")
        self.full_clean()
        return super().save(*args, **kwargs)

    def delete(self, *args, **kwargs):
        if self.requirement.revision.published_at is not None:
            raise ValidationError("La policy d’un Requirement publié ne peut pas être supprimée.")
        return super().delete(*args, **kwargs)
'''
          if 'class RequirementReusePolicy(models.Model):' not in text:
              insert_before = '\n\nclass OpportunitySave(models.Model):'
              text = text.replace(insert_before, policy_code + insert_before)
          p.write_text(text)

          # Audit belongs to Services because it records application to an Assessment/Evidence.
          p = Path('services/models.py')
          text = p.read_text()
          if 'from requirements.trusted_reuse import RequirementReuseSource' not in text:
              text = text.replace('from requirements.contracts import RequirementAssessmentState\n', 'from requirements.contracts import RequirementAssessmentState\nfrom requirements.trusted_reuse import RequirementReuseSource\n')
          audit_code = r'''

class RequirementReuseApplication(models.Model):
    """Privacy-safe append-only audit for one explicit Services Trusted Reuse application."""

    id = models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)
    assessment = models.ForeignKey(
        ServiceRequirementAssessment,
        on_delete=models.PROTECT,
        related_name="trusted_reuse_applications",
    )
    policy = models.ForeignKey(
        "opportunities.RequirementReusePolicy",
        on_delete=models.PROTECT,
        related_name="applications",
    )
    source_type = models.CharField(
        max_length=24,
        choices=[
            (RequirementReuseSource.LIBRARY.value, "Ma Bibliothèque"),
            (RequirementReuseSource.JOURNEY_ARTIFACT.value, "JourneyArtifact historique"),
            (RequirementReuseSource.PROOF.value, "Proof Trust"),
        ],
    )
    source_asset_version = models.ForeignKey(
        "personal_assets.PersonalAssetVersion", on_delete=models.PROTECT,
        related_name="requirement_reuse_applications", null=True, blank=True,
    )
    source_journey_artifact = models.ForeignKey(
        "journeys.JourneyArtifact", on_delete=models.PROTECT,
        related_name="source_requirement_reuse_applications", null=True, blank=True,
    )
    source_proof = models.ForeignKey(
        "trust.Proof", on_delete=models.PROTECT,
        related_name="requirement_reuse_applications", null=True, blank=True,
    )
    intermediate_asset_version = models.ForeignKey(
        "personal_assets.PersonalAssetVersion", on_delete=models.PROTECT,
        related_name="intermediate_requirement_reuse_applications", null=True, blank=True,
    )
    decision = models.CharField(max_length=40)
    reason_codes = models.JSONField(default=list)
    freshness = models.CharField(max_length=32, blank=True)
    sensitivity = models.CharField(max_length=16, blank=True)
    source_status = models.CharField(max_length=32, blank=True)
    source_version = models.PositiveIntegerField(null=True, blank=True)
    confirmation_confirmed = models.BooleanField(default=False)
    materialization_path = models.CharField(max_length=80, blank=True)
    materialized_artifact = models.ForeignKey(
        "journeys.JourneyArtifact", on_delete=models.PROTECT,
        related_name="trusted_reuse_materializations", null=True, blank=True,
    )
    evidence = models.ForeignKey(
        "services.ServiceRequirementEvidence", on_delete=models.PROTECT,
        related_name="trusted_reuse_applications", null=True, blank=True,
    )
    applied_by = models.ForeignKey(
        settings.AUTH_USER_MODEL, on_delete=models.PROTECT,
        related_name="requirement_reuse_applications",
    )
    observed_at = models.DateTimeField()
    applied_at = models.DateTimeField(auto_now_add=True)

    class Meta:
        ordering = ["-applied_at", "id"]
        constraints = [
            models.CheckConstraint(
                condition=(
                    Q(source_asset_version__isnull=False, source_journey_artifact__isnull=True, source_proof__isnull=True)
                    | Q(source_asset_version__isnull=True, source_journey_artifact__isnull=False, source_proof__isnull=True)
                    | Q(source_asset_version__isnull=True, source_journey_artifact__isnull=True, source_proof__isnull=False)
                ),
                name="svc_reuse_app_one_source",
            ),
            models.UniqueConstraint(fields=["assessment", "source_asset_version"], condition=Q(source_asset_version__isnull=False), name="svc_reuse_app_asset_unique"),
            models.UniqueConstraint(fields=["assessment", "source_journey_artifact"], condition=Q(source_journey_artifact__isnull=False), name="svc_reuse_app_art_unique"),
            models.UniqueConstraint(fields=["assessment", "source_proof"], condition=Q(source_proof__isnull=False), name="svc_reuse_app_proof_unique"),
        ]
        indexes = [
            models.Index(fields=["assessment", "applied_at"], name="svc_reuse_app_assess_idx"),
            models.Index(fields=["policy", "applied_at"], name="svc_reuse_app_policy_idx"),
        ]

    def clean(self):
        super().clean()
        errors = {}
        source_ids = [self.source_asset_version_id, self.source_journey_artifact_id, self.source_proof_id]
        if sum(bool(value) for value in source_ids) != 1:
            errors["source_type"] = "Une application Trusted Reuse doit référencer exactement une source canonique."
        expected = {
            RequirementReuseSource.LIBRARY.value: self.source_asset_version_id,
            RequirementReuseSource.JOURNEY_ARTIFACT.value: self.source_journey_artifact_id,
            RequirementReuseSource.PROOF.value: self.source_proof_id,
        }.get(self.source_type)
        if not expected:
            errors["source_type"] = "Le type de source ne correspond pas à la relation canonique renseignée."
        if self.assessment_id and self.policy_id and self.assessment.requirement_id != self.policy.requirement_id:
            errors["policy"] = "La policy doit appartenir au Requirement de l’Assessment."
        if self.materialized_artifact_id and self.assessment_id and self.materialized_artifact.journey_id != self.assessment.context.journey_id:
            errors["materialized_artifact"] = "L’Artifact matérialisé doit appartenir à la Journey cible."
        if self.evidence_id:
            if self.evidence.assessment_id != self.assessment_id:
                errors["evidence"] = "L’Evidence doit appartenir au même Assessment."
            if self.materialized_artifact_id and self.evidence.artifact_id != self.materialized_artifact_id:
                errors["evidence"] = "L’Evidence doit référencer l’Artifact matérialisé exact."
        if self.source_type == RequirementReuseSource.PROOF.value and (self.materialized_artifact_id or self.evidence_id):
            errors["source_type"] = "Une Proof Trust ne doit pas être transformée en faux JourneyArtifact."
        if errors:
            raise ValidationError(errors)

    def save(self, *args, **kwargs):
        if self.pk and not self._state.adding:
            raise ValidationError("Un audit Trusted Reuse est append-only.")
        self.full_clean()
        return super().save(*args, **kwargs)

    def delete(self, *args, **kwargs):
        raise ValidationError("Un audit Trusted Reuse ne peut pas être supprimé silencieusement.")
'''
          if 'class RequirementReuseApplication(models.Model):' not in text:
              text += audit_code
          p.write_text(text)

          # Runtime imports follow ownership.
