name: Recognition

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "recognition/**"
      - "authorization/**"
      - "automation/scheduler.py"
      - "config/settings.py"
      - "config/base_settings.py"
      - "config/urls.py"
      - "templates/recognition/**"
      - ".github/workflows/recognition.yml"
  push:
    branches: [main]
    paths:
      - "recognition/**"
      - "authorization/**"
      - "automation/scheduler.py"
      - "config/settings.py"
      - "config/base_settings.py"
      - "config/urls.py"
      - "templates/recognition/**"
      - ".github/workflows/recognition.yml"

concurrency:
  group: recognition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgresql-recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_ci_recognition
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_ci_recognition"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-recognition-only-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_ci_recognition
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check and migrate PostgreSQL
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Recognition PostgreSQL tests
        run: python manage.py test recognition.tests recognition.test_concurrency recognition.test_platform recognition.test_completion recognition.test_staff_config recognition.test_object_pool recognition.test_beneficiary_authority recognition.test_refund_semantics recognition.test_k_finalization
