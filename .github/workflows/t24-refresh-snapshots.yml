name: T24 snapshot refresh

on:
  push:
    branches:
      - feat/task-24-personal-context-activity-ownership

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T24 branch
        uses: actions/checkout@v4
        with:
          ref: feat/task-24-personal-context-activity-ownership
          fetch-depth: 0

      - name: Download approved CI 883 Playwright diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/TraditionLearningCommunity/makolo/actions/artifacts/9573554643/zip" \
            --output /tmp/t24-playwright.zip
          mkdir -p /tmp/t24-playwright
          unzip -q /tmp/t24-playwright.zip -d /tmp/t24-playwright

      - name: Refresh the three validated participant dashboard baselines
        run: |
          set -eu
          light_desktop="$(find /tmp/t24-playwright -type f -name 'participant-dashboard-light-desktop-actual.png' -print -quit)"
          dark_desktop="$(find /tmp/t24-playwright -type f -name 'participant-dashboard-dark-desktop-actual.png' -print -quit)"
          light_mobile="$(find /tmp/t24-playwright -type f -name 'participant-dashboard-light-mobile-actual.png' -print -quit)"
          test -n "${light_desktop}"
          test -n "${dark_desktop}"
          test -n "${light_mobile}"
          cp "${light_desktop}" e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-light-desktop-chromium-desktop-linux.png
          cp "${dark_desktop}" e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-dark-desktop-chromium-desktop-linux.png
          cp "${light_mobile}" e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-light-mobile-chromium-mobile-linux.png

      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-light-desktop-chromium-desktop-linux.png
          git add e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-dark-desktop-chromium-desktop-linux.png
          git add e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-light-mobile-chromium-mobile-linux.png
          git diff --cached --quiet && exit 0
          git commit -m "T24: refresh participant dashboard visual baselines"
          git push origin HEAD:feat/task-24-personal-context-activity-ownership
