name: Frontend artifact sync

on:
  push:
    branches:
      - feat/m8-mobile-first-mature-experience

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/m8-mobile-first-mature-experience
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build committed frontend artifacts
        run: npm run build
      - name: Commit synchronized artifacts when needed
        shell: bash
        run: |
          if git diff --quiet -- static/dist/makolo.css static/dist/makolo.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/dist/makolo.css static/dist/makolo.js
          git commit -m "build: synchronize frontend artifacts"
          git push origin HEAD:feat/m8-mobile-first-mature-experience
