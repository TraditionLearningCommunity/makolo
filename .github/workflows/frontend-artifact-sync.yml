name: Frontend artifact sync

on:
  push:
    branches:
      - feat/m8-mobile-first-mature-experience

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build committed frontend artifacts
        run: npm run build
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sync
          path: |
            static/dist/makolo.css
            static/dist/makolo.js
          if-no-files-found: error
