name: EF Temporary Dart Format

on:
  push:
    branches:
      - mobile/core-experience-foundation
    paths:
      - "mobile/lib/design/makolo_components.dart"
      - "mobile/lib/design/makolo_patterns.dart"
      - "mobile/lib/design/surface_states.dart"
      - "mobile/test/behavior_primitives_test.dart"
      - ".github/workflows/ef-temp-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mobile/core-experience-foundation
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Format EF files
        working-directory: mobile
        run: |
          dart format             lib/design/makolo_components.dart             lib/design/makolo_patterns.dart             lib/design/surface_states.dart             test/behavior_primitives_test.dart
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet --             mobile/lib/design/makolo_components.dart             mobile/lib/design/makolo_patterns.dart             mobile/lib/design/surface_states.dart             mobile/test/behavior_primitives_test.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             mobile/lib/design/makolo_components.dart             mobile/lib/design/makolo_patterns.dart             mobile/lib/design/surface_states.dart             mobile/test/behavior_primitives_test.dart
          git commit -m "Mobile EF: apply canonical Dart format"
          git push origin HEAD:mobile/core-experience-foundation
