name: Conversation PostgreSQL

on:
  push:
    branches:
      - main
    paths-ignore:
      - "mobile/**"
      - "docs/architecture/mobile-*.md"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - "mobile/**"
      - "docs/architecture/mobile-*.md"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: conversation-postgresql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conversations-postgresql:
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_ci_conversations
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_ci_conversations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-conversations-postgresql-only-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_ci_conversations
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check and migrate Conversation schema
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Conversation PostgreSQL contracts and concurrency
        run: python manage.py test conversations
