name: Temporary green-only finalizer

on:
  push:
    branches:
      - refactor/events-vertical

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: events-vertical-safe-finalizer
  cancel-in-progress: true

jobs:
  safe-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: refactor/events-vertical
          fetch-depth: 0

      - name: Wait for required CI jobs on exact head
        id: initial
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required='django postgresql-smoke e2e'
          green=false
          for attempt in $(seq 1 90); do
            gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" > /tmp/checks.json
            result=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/checks.json'))
          required={'django','postgresql-smoke','e2e'}
          latest={}
          for run in data.get('check_runs',[]):
              if run.get('name') in required:
                  latest[run['name']]=run
          if set(latest) != required:
              print('waiting')
          elif any(run.get('status') != 'completed' for run in latest.values()):
              print('waiting')
          elif all(run.get('conclusion') == 'success' for run in latest.values()):
              print('green')
          else:
              print('red')
          PY
            )
            case "$result" in
              green) green=true; break ;;
              red) break ;;
              *) sleep 20 ;;
            esac
          done
          echo "green=${green}" >> "$GITHUB_OUTPUT"

      - name: Remove temporary workflows from PR branch
        id: cleanup
        env:
          BRANCH: refactor/events-vertical
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/safe-finalize.yml || true
          git rm -f .github/workflows/source-export.yml || true
          if git diff --cached --quiet; then
            new_sha=$(git rev-parse HEAD)
          else
            git commit -m 'chore: remove temporary CI export and finalizer'
            git push origin "HEAD:${BRANCH}"
            new_sha=$(git rev-parse HEAD)
          fi
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"

      - name: Stop safely when initial CI is not green
        if: steps.initial.outputs.green != 'true'
        run: |
          echo 'Required CI was not fully green. Temporary workflows were removed and no merge was attempted.'
          exit 1

      - name: Wait for required CI jobs after cleanup commit
        id: cleaned
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.cleanup.outputs.new_sha }}
        run: |
          set -euo pipefail
          green=false
          for attempt in $(seq 1 90); do
            gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" > /tmp/checks-clean.json
            result=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/checks-clean.json'))
          required={'django','postgresql-smoke','e2e'}
          latest={}
          for run in data.get('check_runs',[]):
              if run.get('name') in required:
                  latest[run['name']]=run
          if set(latest) != required or any(run.get('status') != 'completed' for run in latest.values()):
              print('waiting')
          elif all(run.get('conclusion') == 'success' for run in latest.values()):
              print('green')
          else:
              print('red')
          PY
            )
            case "$result" in
              green) green=true; break ;;
              red) break ;;
              *) sleep 20 ;;
            esac
          done
          test "$green" = true

      - name: Squash merge PR 45 at exact green SHA
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.cleanup.outputs.new_sha }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${REPOSITORY}/pulls/45/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title='refactor: make Events a composed Makolo vertical (#45)' \
            -f commit_message='Complete the canonical Event-to-Activity cutover with green Django, PostgreSQL and E2E validation.' \
            > /tmp/merge.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/merge.json'))
          if not result.get('merged'):
              raise SystemExit(result.get('message','Merge rejected'))
          print(result['sha'])
          with open('/tmp/main-sha','w') as fh:
              fh.write(result['sha'])
          PY
          echo "main_sha=$(cat /tmp/main-sha)" >> "$GITHUB_OUTPUT"

      - name: Verify post-merge main CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
        run: |
          set -euo pipefail
          green=false
          for attempt in $(seq 1 90); do
            gh api "repos/${REPOSITORY}/commits/${MAIN_SHA}/check-runs?per_page=100" > /tmp/main-checks.json
            result=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/main-checks.json'))
          required={'django','postgresql-smoke','e2e'}
          latest={}
          for run in data.get('check_runs',[]):
              if run.get('name') in required:
                  latest[run['name']]=run
          if set(latest) != required or any(run.get('status') != 'completed' for run in latest.values()):
              print('waiting')
          elif all(run.get('conclusion') == 'success' for run in latest.values()):
              print('green')
          else:
              print('red')
          PY
            )
            case "$result" in
              green) green=true; break ;;
              red) break ;;
              *) sleep 20 ;;
            esac
          done
          test "$green" = true
