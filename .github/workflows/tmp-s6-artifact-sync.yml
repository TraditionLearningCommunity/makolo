name: Temporary S6 artifact sync

on:
  push:
    branches:
      - fix/s6-frontend-artifacts-release-gate

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate canonical frontend artifacts
        run: npm run build
      - name: Commit generated artifacts when changed
        shell: bash
        run: |
          git add static/dist
          if git diff --cached --quiet; then
            echo "Frontend artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync S6 frontend artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
