name: M8-A frontend artifact sync

on:
  push:
    branches:
      - m8/mature-home-shell

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'build(frontend): synchronize M8-A artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8/mature-home-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Commit generated artifacts and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m8a-build-sync.yml
          git add static/dist/makolo.css static/dist/makolo.js
          git diff --cached --check
          git commit -m "build(frontend): synchronize M8-A artifacts"
          git push origin HEAD:m8/mature-home-shell
