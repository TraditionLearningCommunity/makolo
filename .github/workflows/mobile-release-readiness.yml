name: Mobile Release Readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment
        required: true
        type: choice
        options:
          - beta
          - prod

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: mobile
    env:
      MAKOLO_ANDROID_KEYSTORE_PATH: android/makolo-release.jks
      MAKOLO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MAKOLO_ANDROID_KEYSTORE_PASSWORD }}
      MAKOLO_ANDROID_KEY_ALIAS: ${{ secrets.MAKOLO_ANDROID_KEY_ALIAS }}
      MAKOLO_ANDROID_KEY_PASSWORD: ${{ secrets.MAKOLO_ANDROID_KEY_PASSWORD }}
      MAKOLO_ANDROID_APP_LINK_SCHEME: https
      MAKOLO_ANDROID_APP_LINK_HOST: ${{ secrets.MAKOLO_ANDROID_APP_LINK_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Materialize release config
        env:
          MAKOLO_MOBILE_CONFIG_JSON: ${{ secrets.MAKOLO_MOBILE_CONFIG_JSON }}
        run: |
          test -n "$MAKOLO_MOBILE_CONFIG_JSON"
          printf '%s' "$MAKOLO_MOBILE_CONFIG_JSON" > "config/${{ inputs.environment }}.local.json"
      - name: Materialize Android signing key
        env:
          MAKOLO_ANDROID_KEYSTORE_B64: ${{ secrets.MAKOLO_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$MAKOLO_ANDROID_KEYSTORE_B64"
          printf '%s' "$MAKOLO_ANDROID_KEYSTORE_B64" | base64 --decode > android/makolo-release.jks
      - name: Validate release configuration
        run: >-
          python tool/validate_release_config.py
          --environment "${{ inputs.environment }}"
          --config "config/${{ inputs.environment }}.local.json"
      - name: Resolve and analyze
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze
      - name: Run mobile tests
        run: flutter test
      - name: Build signed release
        run: >-
          flutter build appbundle
          --release
          --flavor "${{ inputs.environment }}"
          --dart-define-from-file="config/${{ inputs.environment }}.local.json"
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-${{ inputs.environment }}-release-aab
          path: mobile/build/app/outputs/bundle/${{ inputs.environment }}Release/app-${{ inputs.environment }}-release.aab
          if-no-files-found: error
