name: Mobile Canonical Format Fix

on:
  push:
    branches:
      - fix/mobile-shell-launch-settings
    paths:
      - ".github/workflows/mobile-format-fix.yml"

permissions:
  contents: write

jobs:
  format-and-self-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/mobile-shell-launch-settings
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        working-directory: mobile
        run: dart format lib test
      - name: Commit formatted sources and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git rm .github/workflows/mobile-format-fix.yml
          git commit -m "Apply canonical Dart formatting"
          git push origin HEAD:fix/mobile-shell-launch-settings
