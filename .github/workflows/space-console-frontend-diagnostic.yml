name: Space Console frontend diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Commit synchronized frontend bundles
        shell: bash
        run: |
          if git diff --quiet -- static/dist/makolo.css static/dist/makolo.js; then
            echo "Frontend bundles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/dist/makolo.css static/dist/makolo.js
          git commit -m "build: synchronize frontend artifacts"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Upload generated frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: space-console-generated-static-dist
          path: static/dist
          retention-days: 1
