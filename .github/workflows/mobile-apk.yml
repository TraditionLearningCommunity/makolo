name: Mobile APK

# Package an installable Android DEV artifact.
# PR quality remains owned by Mobile CI / Mobile Android Build.
# Automatic main packaging stays fast; a manual full mode is available for checkpoints.

on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Validation before packaging"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full
      backend_target:
        description: "Backend targeted by the DEV APK: PythonAnywhere, Vercel PR #522, or both"
        required: true
        default: "pythonanywhere"
        type: choice
        options:
          - pythonanywhere
          - vercel
          - both
      api_base_url:
        description: "Optional Makolo API override; empty keeps config/dev.json"
        required: false
        default: ""
        type: string
  push:
    branches: [main, fix/discover-a-continuation-context-20261014]
    paths:
      - "mobile/lib/**"
      - "mobile/android/**"
      - "mobile/assets/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - "mobile/.flutter-version"
      - "mobile/config/dev.json"
      - ".github/workflows/mobile-apk.yml"

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-dev-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Toolchain
        run: |
          java -version
          flutter --version
      - name: Resolve dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Full checkpoint validation
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'full'
        run: |
          bash tool/dart_format.sh check
          flutter analyze
          flutter test --exclude-tags golden
      - name: Validate configured DEV mapping
        run: |
          set -euo pipefail
          jq -e '
            .MAKOLO_ENVIRONMENT == "dev"
            and .MAKOLO_MAPS_ENABLED == "true"
            and ((.MAKOLO_MAP_STYLE // "") | startswith("https://"))
            and .MAKOLO_GEOCODING_ENABLED == "true"
            and ((.MAKOLO_GEOCODING_API_KEY // "") | length > 0)
          ' config/dev.json > /dev/null
          echo "DEV maps and geographic suggestions configured."
      - name: Prepare backend-specific DEV runtime configurations
        env:
          MAKOLO_APK_BACKEND_TARGET: ${{ inputs.backend_target || 'pythonanywhere' }}
          MAKOLO_APK_API_BASE_URL: ${{ inputs.api_base_url || '' }}
        run: |
          set -euo pipefail
          if [[ "$MAKOLO_APK_BACKEND_TARGET" == "both" && -n "$MAKOLO_APK_API_BASE_URL" ]]; then
            echo "api_base_url override is only supported when building one backend." >&2
            exit 1
          fi
          cp config/dev.json /tmp/makolo-dev-pythonanywhere.json
          jq --arg api "https://makolo-git-fix-discover-1b7ca6-traditionlearningcommunity-8779.vercel.app/" \
            '.MAKOLO_API_BASE_URL = $api' config/dev.json > /tmp/makolo-dev-vercel.json
          if [[ -n "$MAKOLO_APK_API_BASE_URL" ]]; then
            jq --arg api "$MAKOLO_APK_API_BASE_URL" '.MAKOLO_API_BASE_URL = $api' \
              "/tmp/makolo-dev-${MAKOLO_APK_BACKEND_TARGET}.json" > /tmp/makolo-dev-custom.json
            mv /tmp/makolo-dev-custom.json "/tmp/makolo-dev-${MAKOLO_APK_BACKEND_TARGET}.json"
          fi
      - name: Verify effective DEV runtime configurations
        run: |
          set -euo pipefail
          for config in /tmp/makolo-dev-pythonanywhere.json /tmp/makolo-dev-vercel.json; do
            jq -e '
              .MAKOLO_ENVIRONMENT == "dev"
              and (.MAKOLO_API_BASE_URL | type == "string" and test("^https://[^/]+/?$"))
              and .MAKOLO_MAPS_ENABLED == "true"
              and ((.MAKOLO_MAP_STYLE // "") | startswith("https://"))
              and .MAKOLO_GEOCODING_ENABLED == "true"
              and ((.MAKOLO_GEOCODING_API_KEY // "") | length > 0)
            ' "$config" > /dev/null
          done
          echo "Both DEV configurations validated (no provider values printed)."
      - name: Build Android DEV debug APK (PythonAnywhere)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.backend_target == 'pythonanywhere' || inputs.backend_target == 'both'))
        run: flutter build apk --debug --flavor dev --dart-define-from-file=/tmp/makolo-dev-pythonanywhere.json
      - name: Publish Android DEV debug APK (PythonAnywhere)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.backend_target == 'pythonanywhere' || inputs.backend_target == 'both'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-android-dev-pythonanywhere-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build Android DEV debug APK (Vercel PR 522)
        if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || ((github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.backend_target == 'vercel' || inputs.backend_target == 'both')))
        run: flutter build apk --debug --flavor dev --dart-define-from-file=/tmp/makolo-dev-vercel.json
      - name: Publish Android DEV debug APK (Vercel PR 522)
        if: github.event_name == 'workflow_dispatch' && (inputs.backend_target == 'vercel' || inputs.backend_target == 'both')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-android-dev-vercel-pr522-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
