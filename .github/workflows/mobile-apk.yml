name: Mobile APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Makolo API base URL for this manual test APK"
        required: true
        type: string

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --exclude-tags golden
      - name: Build Android debug APK
        env:
          MAKOLO_APK_API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --debug --dart-define=MAKOLO_API_BASE_URL="$MAKOLO_APK_API_BASE_URL"
      - name: Publish Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-android-debug-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
