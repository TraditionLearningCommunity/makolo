name: Mobile APK

# Package an installable Android DEV artifact.
# PR quality remains owned by Mobile CI / Mobile Android Build.
# Automatic main packaging stays fast; a manual full mode is available for checkpoints.

on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Validation before packaging"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full
      api_base_url:
        description: "Optional Makolo API override; empty keeps config/dev.json"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "mobile/lib/**"
      - "mobile/android/**"
      - "mobile/assets/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - "mobile/.flutter-version"
      - "mobile/config/dev.json"
      - ".github/workflows/mobile-apk.yml"

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-dev-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Toolchain
        run: |
          java -version
          flutter --version
      - name: Resolve dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Full checkpoint validation
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'full'
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test --exclude-tags golden
      - name: Prepare DEV runtime configuration
        env:
          MAKOLO_APK_API_BASE_URL: ${{ inputs.api_base_url || '' }}
        run: |
          set -euo pipefail
          cp config/dev.json /tmp/makolo-dev-runtime.json
          if [[ -n "$MAKOLO_APK_API_BASE_URL" ]]; then
            jq --arg api "$MAKOLO_APK_API_BASE_URL"               '.MAKOLO_API_BASE_URL = $api'               /tmp/makolo-dev-runtime.json > /tmp/makolo-dev-runtime.override.json
            mv /tmp/makolo-dev-runtime.override.json /tmp/makolo-dev-runtime.json
          fi
      - name: Build Android DEV debug APK
        run: flutter build apk --debug --flavor dev --dart-define-from-file=/tmp/makolo-dev-runtime.json
      - name: Publish Android DEV debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-android-dev-debug-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
