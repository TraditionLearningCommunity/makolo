name: UX snapshot refresh

on:
  push:
    branches:
      - ux/refine-product-experience
    paths:
      - .github/workflows/ux-snapshot-refresh.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh-reviewed-baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: ux/refine-product-experience
          fetch-depth: 0

      - name: Download inspected E2E diagnostics
        uses: actions/download-artifact@v4
        with:
          name: playwright-e2e-diagnostics
          path: artifact
          github-token: ${{ github.token }}
          repository: TraditionLearningCommunity/makolo
          run-id: 32552462179

      - name: Verify and install reviewed baselines
        shell: bash
        run: |
          set -euo pipefail

          discovery_light_desktop="$(find artifact -type f -name 'discovery-light-desktop-actual.png' -print -quit)"
          scanner_dark_desktop="$(find artifact -type f -name 'scanner-dark-desktop-actual.png' -print -quit)"
          discovery_light_mobile="$(find artifact -type f -name 'discovery-light-mobile-actual.png' -print -quit)"

          test -n "$discovery_light_desktop" && test -f "$discovery_light_desktop"
          test -n "$scanner_dark_desktop" && test -f "$scanner_dark_desktop"
          test -n "$discovery_light_mobile" && test -f "$discovery_light_mobile"

          printf '%s  %s\n' '2c9ac3f5418e11b25cee1fff1112477c2d348039bc486d0ec5c7e02457255d96' "$discovery_light_desktop" | sha256sum -c -
          printf '%s  %s\n' '00b12412ee4faba6d3225a71aa3f8cd7dc73a94f340b52bbf3e66410d84b9003' "$scanner_dark_desktop" | sha256sum -c -
          printf '%s  %s\n' '189adb4395fbeca82e5f7ca88aa891fb13b03d572e0fd85afac84df42ec7af4a' "$discovery_light_mobile" | sha256sum -c -

          install -m 0644 "$discovery_light_desktop" 'e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png'
          install -m 0644 "$scanner_dark_desktop" 'e2e/specs/visual.spec.mjs-snapshots/scanner-dark-desktop-chromium-desktop-linux.png'
          install -m 0644 "$discovery_light_mobile" 'e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png'

          rm '.github/workflows/ux-snapshot-refresh.yml'

          expected="$(printf '%s\n' \
            '.github/workflows/ux-snapshot-refresh.yml' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/scanner-dark-desktop-chromium-desktop-linux.png' | sort)"
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          test "$changed" = "$expected"

      - name: Commit reviewed baselines and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: refresh remaining reviewed UX baselines'
          git push origin HEAD:ux/refine-product-experience
