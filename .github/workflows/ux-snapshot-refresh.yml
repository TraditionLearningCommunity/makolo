name: UX snapshot refresh

on:
  push:
    branches:
      - ux/refine-product-experience
    paths:
      - .github/workflows/ux-snapshot-refresh.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh-reviewed-baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: ux/refine-product-experience
          fetch-depth: 0

      - name: Download inspected E2E diagnostics
        uses: actions/download-artifact@v4
        with:
          name: playwright-e2e-diagnostics
          path: artifact
          github-token: ${{ github.token }}
          repository: TraditionLearningCommunity/makolo
          run-id: 32552872370

      - name: Verify and install reviewed baselines
        shell: bash
        run: |
          set -euo pipefail

          scanner_light_desktop="$(find artifact -type f -name 'scanner-light-desktop-actual.png' -print -quit)"
          scanner_light_mobile="$(find artifact -type f -name 'scanner-light-mobile-actual.png' -print -quit)"

          test -n "$scanner_light_desktop" && test -f "$scanner_light_desktop"
          test -n "$scanner_light_mobile" && test -f "$scanner_light_mobile"

          printf '%s  %s\n' '907d45c3e8f14707e960c6f8beecc2d96a88157d9c06f61ddf3d09efe3ed5f5f' "$scanner_light_desktop" | sha256sum -c -
          printf '%s  %s\n' '7dff6f91783179f282e73eda099c362152de4deb50a9348e973cfe11793c7a1e' "$scanner_light_mobile" | sha256sum -c -

          install -m 0644 "$scanner_light_desktop" 'e2e/specs/visual.spec.mjs-snapshots/scanner-light-desktop-chromium-desktop-linux.png'
          install -m 0644 "$scanner_light_mobile" 'e2e/specs/visual.spec.mjs-snapshots/scanner-light-mobile-chromium-mobile-linux.png'

          rm '.github/workflows/ux-snapshot-refresh.yml'

          expected="$(printf '%s\n' \
            '.github/workflows/ux-snapshot-refresh.yml' \
            'e2e/specs/visual.spec.mjs-snapshots/scanner-light-desktop-chromium-desktop-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/scanner-light-mobile-chromium-mobile-linux.png' | sort)"
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          test "$changed" = "$expected"

      - name: Commit reviewed baselines and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: refresh final reviewed scanner baselines'
          git push origin HEAD:ux/refine-product-experience
