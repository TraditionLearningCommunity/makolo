name: API Contract

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "docs/api/**"
      - ".github/workflows/api-contract.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "docs/api/**"
      - ".github/workflows/api-contract.yml"

concurrency:
  group: api-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-api-contract-only-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run Django contract checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Generate and validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/makolo-openapi.json --format openapi-json --validate
      - name: Protect supported client contract
        run: >-
          python scripts/check_openapi_contract.py
          --schema /tmp/makolo-openapi.json
          --manifest docs/api/supported-client-contract-v1.json
      - name: Validate C0 mature surface fixtures
        run: >-
          python scripts/check_surface_contract_fixtures.py
          --fixtures docs/api/fixtures/mature-surface-foundation-v1.json
          --manifest docs/api/supported-client-contract-v1.json
