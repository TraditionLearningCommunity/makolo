name: Q reconcile frontend sync

on:
  push:
    branches:
      - capital/q-reconcile-current-main

permissions:
  contents: write

concurrency:
  group: q-reconcile-frontend-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Commit synchronized frontend artifacts
        run: |
          if git diff --quiet -- package-lock.json static/dist && test -z "$(git status --porcelain -- package-lock.json static/dist)"; then
            echo "Frontend artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json static/dist
          git commit -m "Sync frontend artifacts after Q reconciliation"
          git push origin HEAD:${{ github.ref_name }}
