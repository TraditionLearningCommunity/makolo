name: Mobile Format Export

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Format changed mobile sources
        run: |
          dart format             lib/app/makolo_app.dart             lib/features/discovery/discovery_routes.dart             lib/features/discovery/discovery_screens.dart             lib/features/settings/settings_screen.dart             lib/features/splash/splash_screen.dart             lib/navigation/avatar_sheet.dart             test/avatar_sheet_test.dart             test/discovery_shell_contract_test.dart             test/shell_header_test.dart
      - name: Publish formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: makolo-mobile-formatted-sources
          path: |
            mobile/lib/app/makolo_app.dart
            mobile/lib/features/discovery/discovery_routes.dart
            mobile/lib/features/discovery/discovery_screens.dart
            mobile/lib/features/settings/settings_screen.dart
            mobile/lib/features/splash/splash_screen.dart
            mobile/lib/navigation/avatar_sheet.dart
            mobile/test/avatar_sheet_test.dart
            mobile/test/discovery_shell_contract_test.dart
            mobile/test/shell_header_test.dart
