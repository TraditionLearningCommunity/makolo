name: Temporary Mobile Formatter

on:
  push:
    branches:
      - feat/mobile-a2-personal-interoperability-closure
    paths:
      - "mobile/lib/**"
      - "mobile/test/**"
      - ".github/workflows/mobile-format-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/mobile-a2-personal-interoperability-closure
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Format
        run: dart format lib test
      - name: Commit formatter output
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/lib mobile/test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git commit -m "style(mobile): apply canonical dart format"
          git push origin HEAD:feat/mobile-a2-personal-interoperability-closure
