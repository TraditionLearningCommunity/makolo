name: Now Presentation Goldens

on:
  pull_request:
    paths:
      - "mobile/lib/features/now/**"
      - "mobile/lib/presentation/contracts/now_presentation.dart"
      - "mobile/lib/dev/scenarios/now_scenarios.dart"
      - "mobile/test/now_golden_test.dart"
      - "mobile/test/goldens/now/**"
      - ".github/workflows/now-golden-baselines.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: now-goldens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate owner DTO and Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify generated-code policy
        run: git diff --exit-code -- lib test
      - name: Canonical format check
        run: bash tool/dart_format.sh check
      - name: Verify approved G01 S1-S5 references
        run: flutter test test/now_golden_test.dart
      - name: Render review artifacts without changing the branch
        if: always()
        run: flutter test --update-goldens test/now_golden_test.dart
      - name: Publish canonical renderings and differences
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-now-golden-review
          path: |
            mobile/test/goldens/now/*.png
            mobile/test/failures/*.png
          if-no-files-found: error
          retention-days: 7
