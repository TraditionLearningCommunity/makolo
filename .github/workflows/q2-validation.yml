name: Q2 validation

on:
  push:
    branches:
      - validation/q2-library-reuse-ci

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q2-validation-only-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check models and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Q2 and directly impacted Journey tests
        run: |
          python manage.py test personal_assets journeys.test_task31_services_core

  full-django:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q2-full-validation-only-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          npm ci
      - name: Build frontend
        run: npm run build
      - name: Check and migrate
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run full Django suite
        run: python manage.py test

  postgresql-q2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_q2_validation
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-q2-validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_q2_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q2-postgres-validation-only-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_q2_validation
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-q2-validation
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check migrate and run Q2 tests on PostgreSQL
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test personal_assets journeys.test_task31_services_core

  beta-seed:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q2-beta-validation-only-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DB_PATH: /tmp/makolo-q2-beta.sqlite3
      MAKOLO_DEMO_PASSWORD: q2-beta-demo-password-not-production
      BETA_AS_OF: "2026-08-21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate beta seed
        run: |
          rm -f "$DJANGO_DB_PATH"
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py seed_makolo_demo --scale beta --as-of "$BETA_AS_OF"
          python manage.py validate_makolo_demo --as-of "$BETA_AS_OF"
