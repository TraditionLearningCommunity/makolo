name: Mobile A1 polish formatter

on:
  push:
    branches:
      - mobile/a1-device-polish

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mobile/a1-device-polish
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Format mobile Dart
        working-directory: mobile
        run: dart format lib test
      - name: Commit formatter output
        run: |
          if git diff --quiet -- mobile/lib mobile/test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git commit -m "style(a1): apply Dart formatter [formatted]"
          git push origin HEAD:mobile/a1-device-polish
