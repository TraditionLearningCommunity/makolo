name: Q4 Trusted Reuse validation

on:
  push:
    branches:
      - capital/q4-trusted-reuse-hardening
  workflow_dispatch:

concurrency:
  group: q4-trusted-reuse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  q4-targeted:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q4-ci-local-validation-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check model and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run Q4 contracts and Trusted Reuse first
        run: |
          python manage.py test requirements.test_q4_trusted_reuse_policy services.test_q4_trusted_reuse services.test_q4_trusted_reuse_audit services.test_q4_trusted_reuse_permissions services.test_q4_trusted_reuse_ambiguity services.test_q4_trusted_reuse_ui services.test_q4_trusted_reuse_concurrency
      - name: Run Q1 Q2 Q3 Q4 train regressions
        run: |
          python manage.py test personal_assets requirements.test_q4_trusted_reuse_policy services.test_q4_trusted_reuse services.test_q4_trusted_reuse_audit services.test_q4_trusted_reuse_permissions services.test_q4_trusted_reuse_ambiguity services.test_q4_trusted_reuse_ui services.test_q4_trusted_reuse_concurrency
      - name: Run touched-domain regressions
        run: |
          python manage.py test journeys.tests trust.tests requirements services.test_task34a_requirements

  q4-full-django:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q4-ci-full-django-local-validation-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check model and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run full Django test suite
        run: python manage.py test

  q4-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_ci_q4
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_ci_q4"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: q4-ci-postgresql-local-validation-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_ci_q4
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check migrate PostgreSQL
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Q4 and train Q on PostgreSQL
        run: |
          python manage.py test requirements.test_q4_trusted_reuse_policy services.test_q4_trusted_reuse services.test_q4_trusted_reuse_audit services.test_q4_trusted_reuse_permissions services.test_q4_trusted_reuse_ambiguity services.test_q4_trusted_reuse_ui services.test_q4_trusted_reuse_concurrency personal_assets
      - name: Reproduce and validate Trust PostgreSQL locking
        run: |
          python manage.py test trust.tests
