name: Projector Actor 7

on:
  pull_request:
    paths:
      - "projector/**"
      - "activities/projector_snapshots.py"
      - "activities/services.py"
      - "domain_events/**"
      - "events/models.py"
      - "events/legacy_compat.py"
      - "config/base_settings.py"
      - "docs/architecture/projector.md"
      - ".github/workflows/projector.yml"
  push:
    branches: [main]
    paths:
      - "projector/**"
      - "activities/projector_snapshots.py"
      - "activities/services.py"
      - "domain_events/**"
      - "events/models.py"
      - "events/legacy_compat.py"
      - "config/base_settings.py"
      - ".github/workflows/projector.yml"

jobs:
  projector-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_ci_projector
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_ci_projector"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-projector-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_ci_projector
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Test Actor 7
        run: python manage.py test projector
