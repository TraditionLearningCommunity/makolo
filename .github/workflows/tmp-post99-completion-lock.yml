name: Temporary post-99 completion lock fix

on:
  push:
    branches:
      - fix/post-99-main-regressions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-99-main-regressions
          fetch-depth: 0
      - name: Scope SubscriptionTransition completion lock
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('subscriptions/transition_services.py')
          text = path.read_text()
          marker = 'def complete_subscription_transition(*, transition):'
          before, after = text.split(marker, 1)
          old = 'SubscriptionTransition.objects.select_for_update()'
          new = 'SubscriptionTransition.objects.select_for_update(of=("self",))'
          if old not in after:
              raise SystemExit('Expected completion transition lock not found')
          after = after.replace(old, new, 1)
          path.write_text(before + marker + after)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/transition_services.py
          git commit -m "fix: scope Subscription completion transition lock"
          git push origin HEAD:fix/post-99-main-regressions
