name: I5 refresh approved Discover snapshots

on:
  push:
    branches:
      - intelligence/i5-discover-intelligence-hardening
    paths:
      - .github/workflows/i5-refresh-discover-snapshots.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-e2e-only-secret-key-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intelligence/i5-discover-intelligence-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          npm ci
          npm run build
      - name: Install Chromium
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt-mirrors.txt >/dev/null
          npx playwright install --with-deps chromium
      - name: Prepare deterministic E2E environment
        run: bash scripts/prepare-e2e.sh
      - name: Refresh visual snapshots
        env:
          E2E_SKIP_PREP: "1"
        run: bash scripts/run-e2e.sh e2e/specs/visual.spec.mjs --update-snapshots
      - name: Verify only approved Discover baselines changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- e2e/specs/visual.spec.mjs-snapshots | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            "e2e/specs/visual.spec.mjs-snapshots/discovery-dark-desktop-chromium-desktop-linux.png"
            "e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png"
            "e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            echo "Unexpected visual snapshot change set."
            exit 1
          fi
      - name: Commit approved Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            e2e/specs/visual.spec.mjs-snapshots/discovery-dark-desktop-chromium-desktop-linux.png \
            e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png \
            e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png
          git commit -m "test: refresh Discover 2027 visual baselines"
          git push origin HEAD:intelligence/i5-discover-intelligence-hardening
