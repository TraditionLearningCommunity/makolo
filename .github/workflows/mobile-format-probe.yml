name: Mobile Format Probe

on:
  push:
    branches:
      - mobile/a1-final-integration

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: dart format lib/app/router.dart
      - name: Show formatter diff
        run: git diff -- lib/app/router.dart
