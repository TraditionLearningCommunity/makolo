name: CORE-1 Temporary Dart Format

on:
  push:
    branches:
      - mobile/core-integration
    paths:
      - "mobile/lib/design/surface_states.dart"
      - "mobile/lib/presentation/projection_surface_adapter.dart"
      - "mobile/test/core_integration_test.dart"
      - "mobile/test/launch_gate_test.dart"
      - ".github/workflows/core1-temp-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mobile/core-integration
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Format CORE-1 integration files
        working-directory: mobile
        run: |
          dart format             lib/design/surface_states.dart             lib/presentation/projection_surface_adapter.dart             test/core_integration_test.dart             test/launch_gate_test.dart
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet --             mobile/lib/design/surface_states.dart             mobile/lib/presentation/projection_surface_adapter.dart             mobile/test/core_integration_test.dart             mobile/test/launch_gate_test.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             mobile/lib/design/surface_states.dart             mobile/lib/presentation/projection_surface_adapter.dart             mobile/test/core_integration_test.dart             mobile/test/launch_gate_test.dart
          git commit -m "Mobile CORE-1: apply canonical Dart format"
          git push origin HEAD:mobile/core-integration
