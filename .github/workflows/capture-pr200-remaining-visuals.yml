name: Capture PR200 remaining visuals

on:
  push:
    branches:
      - fix/finalize-discovery-presentation

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-e2e-only-secret-key-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci
          npm run build
      - name: Install Chromium
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt-mirrors.txt >/dev/null
          npx playwright install --with-deps chromium
      - name: Prepare deterministic E2E environment
        run: bash scripts/prepare-e2e.sh
      - name: Capture remaining desktop baselines
        env:
          E2E_SKIP_PREP: "1"
        run: |
          npx playwright test e2e/specs/visual.spec.mjs --project=chromium-desktop --grep 'representative light desktop surfaces|representative dark desktop surfaces' --update-snapshots || true
      - name: Capture remaining mobile baseline
        env:
          E2E_SKIP_PREP: "1"
        run: |
          npx playwright test e2e/specs/visual.spec.mjs --project=chromium-mobile --grep 'representative mobile surfaces' --update-snapshots || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr200-remaining-visuals
          path: |
            e2e/specs/visual.spec.mjs-snapshots/participant-dashboard-light-desktop-chromium-desktop-linux.png
            e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-dark-desktop-chromium-desktop-linux.png
          if-no-files-found: error
          retention-days: 2
