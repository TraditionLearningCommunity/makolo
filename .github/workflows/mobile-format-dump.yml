name: Mobile Format Dump

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-format-dump.yml"

permissions:
  contents: read

jobs:
  format-dump:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: |
          dart format lib/design/makolo_theme.dart test/makolo_theme_test.dart
          git diff -- lib/design/makolo_theme.dart test/makolo_theme_test.dart
