name: Frontend build capture

on:
  push:
    branches:
      - feat/j0-action-conversations-preconvergence

concurrency:
  group: frontend-build-capture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Upload generated frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: makolo-static-dist
          path: static/dist
          if-no-files-found: error
          retention-days: 1
