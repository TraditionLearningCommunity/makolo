name: Frontend build capture

on:
  push:
    branches:
      - feat/j0-action-conversations-preconvergence

concurrency:
  group: frontend-build-capture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Commit generated frontend artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/dist
          if git diff --cached --quiet; then
            echo "Frontend artifacts already synchronized."
          else
            git commit -m "Sync generated frontend artifacts for Task J"
            git push
          fi
