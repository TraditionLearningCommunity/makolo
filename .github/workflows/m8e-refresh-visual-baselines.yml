name: M8-E visual baseline refresh

on:
  push:
    branches:
      - m8/experience-convergence
    paths:
      - .github/workflows/m8e-refresh-visual-baselines.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-e2e-only-secret-key-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8/experience-convergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Install Playwright browsers
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt-mirrors.txt >/dev/null
          npx playwright install --with-deps chromium firefox
      - name: Refresh visual snapshots with canonical runner
        run: bash scripts/run-e2e.sh e2e/specs/visual.spec.mjs --update-snapshots --timeout=120000
      - name: Review exact baseline file changes
        run: |
          git status --short -- e2e/specs/visual.spec.mjs-snapshots
          git diff --stat -- e2e/specs/visual.spec.mjs-snapshots
          git diff --numstat -- e2e/specs/visual.spec.mjs-snapshots
          test -n "$(git status --short -- e2e/specs/visual.spec.mjs-snapshots)"
      - name: Commit refreshed baselines to the M8-E branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/specs/visual.spec.mjs-snapshots
          git commit -m "M8-E: refresh reviewed visual baselines"
          git push origin HEAD:m8/experience-convergence
