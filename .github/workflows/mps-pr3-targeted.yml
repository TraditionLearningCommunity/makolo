name: MPS PR3 Targeted Check

on:
  push:
    branches:
      - "restore/mps-pr3-product"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: mps-pr3-targeted-ci-secret-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: MPS targeted tests
        run: >-
          python manage.py test
          presentations.tests
          presentations.test_studio
          presentations.test_library_hardening
          presentations.test_mobile_api
