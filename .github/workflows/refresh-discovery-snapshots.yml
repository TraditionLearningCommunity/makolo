name: Refresh discovery visual snapshots

on:
  push:
    branches:
      - feat/spatiotemporal-discovery
    paths:
      - .github/workflows/refresh-discovery-snapshots.yml

permissions:
  contents: write

env:
  ARTIFACT_ID: "9428561370"

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/spatiotemporal-discovery
          fetch-depth: 0

      - name: Download validated Playwright diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw631
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/pw631.zip
          unzip -q /tmp/pw631.zip -d /tmp/pw631

      - name: Refresh only Discovery desktop baselines
        run: |
          set -euo pipefail
          root="/tmp/pw631/home/runner/work/makolo/makolo/test-results/playwright"
          cp "$root/visual-representative-light-desktop-surfaces-visual-chromium-desktop/discovery-light-desktop-actual.png" \
            "e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png"
          cp "$root/visual-representative-dark-desktop-surfaces-visual-chromium-desktop/discovery-dark-desktop-actual.png" \
            "e2e/specs/visual.spec.mjs-snapshots/discovery-dark-desktop-chromium-desktop-linux.png"
          rm -- ".github/workflows/refresh-discovery-snapshots.yml"
          git status --short

      - name: Commit validated baselines and remove helper workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png" \
            "e2e/specs/visual.spec.mjs-snapshots/discovery-dark-desktop-chromium-desktop-linux.png" \
            ".github/workflows/refresh-discovery-snapshots.yml"
          git commit -m "test: refresh discovery visual snapshots"
          git push origin HEAD:feat/spatiotemporal-discovery
