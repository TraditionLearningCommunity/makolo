name: Temporary post-99 regression patch

on:
  push:
    branches:
      - fix/post-99-main-regressions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-99-main-regressions
          fetch-depth: 0
      - name: Apply minimal regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('subscriptions/transition_services.py')
          text = path.read_text()
          old = 'Subscription.objects.select_for_update()\n        .select_related("profile", "space")'
          new = 'Subscription.objects.select_for_update(of=("self",))\n        .select_related("profile", "space")'
          if old not in text:
              raise SystemExit('Subscription lock pattern not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('services/attention_selectors.py')
          text = path.read_text()
          old = '    return queryset.distinct()\n\n\ndef manager_attention_journeys'
          new = '    return queryset.order_by().distinct()\n\n\ndef manager_attention_journeys'
          if old not in text:
              raise SystemExit('Facilitator attention pattern not found')
          text = text.replace(old, new, 1)
          old = '        .distinct()\n    )\n\n\ndef opportunity_curator_attention'
          new = '        .distinct()\n        .order_by()\n    )\n\n\ndef opportunity_curator_attention'
          if old not in text:
              raise SystemExit('Manager attention pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/tmp-post99-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/transition_services.py services/attention_selectors.py
          git commit -m "fix: restore post-99 CI invariants"
          git push origin HEAD:fix/post-99-main-regressions