name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest

    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed Python dependencies
        run: python -m pip check

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Verify committed frontend artifacts are synchronized
        run: |
          git diff --exit-code -- package-lock.json static/dist
          git status --porcelain -- package-lock.json static/dist | tee /tmp/frontend-status.txt
          test ! -s /tmp/frontend-status.txt

      - name: Reject critical runtime CDN and inline-script regressions
        run: npm run check:runtime-deps

      - name: Run Django system checks
        run: python manage.py check

      - name: Check production security settings
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-production-security-check-only-long-random-looking-secret-2026-not-a-real-secret"
          DJANGO_ALLOWED_HOSTS: makolo.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://makolo.example.test
          MAKOLO_PUBLIC_BASE_URL: https://makolo.example.test
          PAYMENTS_WEBHOOK_SECRET: ci-production-webhook-check-secret
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Collect production static files without special ignores
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-production-staticfiles-only-long-random-looking-secret-2026-not-a-real-secret"
          DJANGO_ALLOWED_HOSTS: makolo.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://makolo.example.test
          MAKOLO_PUBLIC_BASE_URL: https://makolo.example.test
          PAYMENTS_WEBHOOK_SECRET: ci-production-webhook-check-secret
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: |
          rm -rf staticfiles
          python manage.py collectstatic --noinput

      - name: Validate WhiteNoise manifest
        run: python scripts/validate_static_manifest.py

      - name: Run tests
        run: python manage.py test
