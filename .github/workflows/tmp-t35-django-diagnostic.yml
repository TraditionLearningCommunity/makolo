name: Temporary T35 Django diagnostic

on:
  push:
    branches:
      - fix/t35-post-merge-ci

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, 'diagnostic: capture django failure') }}
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: t35-diagnostic-only-secret
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/t35-post-merge-ci
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Capture full Django test failure
        shell: bash
        run: |
          set +e
          python manage.py test > .t35-django-diagnostic.log 2>&1
          status=$?
          echo "exit_status=$status" >> .t35-django-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .t35-django-diagnostic.log
          git commit -m "diagnostic: capture django failure"
          git push origin HEAD:fix/t35-post-merge-ci
