name: Demo generation validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/demo_generation/**'
      - 'funding/**'
      - 'groups/**'
      - 'objectives/**'
      - 'payments/**'
      - 'journeys/**'
      - '.github/workflows/demo-generation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-generation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: 'False'
      DJANGO_SECRET_KEY: ci-demo-validation-placeholder-not-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify demo generation syntax
        run: python -m compileall -q scripts/demo_generation
      - name: Validate isolated demo domain integration
        run: python -m scripts.demo_generation validate --quick
