name: Temporary source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create workspace archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=staticfiles \
            --exclude='*.sqlite3' \
            -czf /tmp/makolo-workspace.tgz .

      - name: Download Python wheelhouse
        run: |
          python -m pip download \
            --dest /tmp/makolo-wheelhouse \
            -r requirements.txt
          tar -czf /tmp/makolo-wheelhouse.tgz -C /tmp makolo-wheelhouse

      - name: Upload workspace archive
        uses: actions/upload-artifact@v4
        with:
          name: makolo-workspace
          path: /tmp/makolo-workspace.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Python wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: makolo-python-wheelhouse
          path: /tmp/makolo-wheelhouse.tgz
          if-no-files-found: error
          retention-days: 1
