name: Temporary source export

on:
  push:
    branches:
      - refactor/events-vertical
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package source workspace
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=staticfiles \
            --exclude='*.sqlite3' \
            -czf /tmp/makolo-source.tar.gz .

      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: makolo-source-${{ github.sha }}
          path: /tmp/makolo-source.tar.gz
          if-no-files-found: error
          retention-days: 1
