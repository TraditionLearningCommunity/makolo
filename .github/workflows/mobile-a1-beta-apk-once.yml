name: A1 Beta APK Once

on:
  push:
    branches: [mobile/a1-native-host-foundation]
    paths:
      - ".github/workflows/mobile-a1-beta-apk-once.yml"

permissions:
  contents: read

jobs:
  beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Toolchain
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Verify beta server is reachable
        working-directory: .
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://makolo.pythonanywhere.com/ || true)
          test "$code" != "000"
      - name: Build Android debug APK for beta
        run: flutter build apk --debug --dart-define=MAKOLO_API_BASE_URL=https://makolo.pythonanywhere.com
      - name: Publish beta APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-a1-beta-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
