name: Temporary frontend artifact sync

on:
  push:
    branches:
      - fix/frontend-artifact-sync-post-114
    paths:
      - .github/workflows/tmp-sync-frontend-artifacts.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Commit synchronized frontend artifacts
        run: |
          git status --short -- package-lock.json static/dist
          if git diff --quiet -- package-lock.json static/dist && test -z "$(git status --porcelain -- package-lock.json static/dist)"; then
            echo "Expected generated frontend changes, but the build produced none."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json static/dist
          git commit -m "fix: synchronize frontend build artifacts"
          git push origin HEAD:fix/frontend-artifact-sync-post-114
