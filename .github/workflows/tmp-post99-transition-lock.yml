name: Temporary post-99 transition lock repair

on:
  push:
    branches:
      - fix/post-99-main-regressions

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-99-main-regressions
          fetch-depth: 0
      - name: Patch nullable-join lock
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('subscriptions/transition_services.py')
          text = path.read_text()
          old = 'SubscriptionTransition.objects.select_for_update()\n        .select_related('
          new = 'SubscriptionTransition.objects.select_for_update(of=("self",))\n        .select_related('
          if text.count(old) != 1:
              raise SystemExit(f'Expected one transition lock pattern, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/tmp-post99-transition-lock.yml').unlink()
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/transition_services.py .github/workflows/tmp-post99-transition-lock.yml
          git commit -m "fix: scope subscription transition row lock"
          git push origin HEAD:fix/post-99-main-regressions
