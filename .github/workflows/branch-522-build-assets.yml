name: Temporary #522 frontend artifact sync
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/branch-522-build-assets.yml'
  push:
    branches: [fix/discover-a-continuation-context-20261014]
    paths:
      - ".github/workflows/branch-522-build-assets.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/branch-522-build-assets.yml
          git add -A -- static/dist package-lock.json .github/workflows/branch-522-build-assets.yml
          git diff --cached --exit-code && exit 0 || true
          git commit -m "fix(ci): synchronize frontend distribution outputs"
          git push origin "HEAD:fix/discover-a-continuation-context-20261014"
