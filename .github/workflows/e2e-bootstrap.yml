name: E2E bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: test/end-to-end-product-validation

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh npm lock and install exact dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
          npm run check:runtime-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Generate deterministic Linux visual baselines
        run: |
          npm run test:e2e -- e2e/specs/visual.spec.mjs --update-snapshots --project=chromium-desktop
          npm run test:e2e -- e2e/specs/visual.spec.mjs --update-snapshots --project=chromium-mobile

      - name: Commit generated lock, dist and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json static/dist e2e/specs/visual.spec.mjs-snapshots
          if git diff --cached --quiet; then
            echo "Generated E2E artifacts are already synchronized."
          else
            git commit -m "test: refresh e2e generated artifacts"
            git push origin HEAD:test/end-to-end-product-validation
          fi

      - name: Exercise the complete Playwright suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/makolo-playwright.log

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bootstrap-diagnostics
          path: |
            playwright-report
            test-results/playwright
            /tmp/makolo-playwright.log
            /tmp/makolo-e2e-server.log
          if-no-files-found: ignore
          retention-days: 5
