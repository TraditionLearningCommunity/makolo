name: Subscriptions S2

on:
  pull_request:
    branches:
      - main
    paths:
      - "subscriptions/**"
      - "accounts/**"
      - "organizations/**"
      - "activities/**"
      - "config/settings.py"
      - "docs/architecture/subscriptions-*.md"
      - ".github/workflows/subscriptions-s2.yml"
  push:
    branches:
      - main
    paths:
      - "subscriptions/**"
      - "accounts/**"
      - "organizations/**"
      - "activities/**"
      - "config/settings.py"
      - "docs/architecture/subscriptions-*.md"
      - ".github/workflows/subscriptions-s2.yml"

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_subscriptions_s2_ci
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_subscriptions_s2_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-subscriptions-s2-only-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_subscriptions_s2_ci
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Django checks
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply fresh migrations
        run: python manage.py migrate --noinput
      - name: Run S1 catalogue regression tests
        run: python manage.py test subscriptions.tests
      - name: Run S2 runtime tests
        run: python manage.py test subscriptions.test_s2_runtime subscriptions.test_s2_grant_regressions
      - name: Run S2 PostgreSQL concurrency tests
        run: python manage.py test subscriptions.test_s2_concurrency
