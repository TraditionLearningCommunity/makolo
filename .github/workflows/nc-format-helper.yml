name: NC Format Helper

on:
  push:
    branches:
      - mobile/core-native-continuity
    paths:
      - ".github/workflows/nc-format-helper.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Format NC files and show patch
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/data/files/file_transfer_coordinator.dart
            lib/data/files/profile_file_store.dart
            lib/platform/files/native_file_acquisition.dart
            lib/platform/location/location_capability.dart
            lib/platform/scanner/code_scanner.dart
            lib/platform/sharing/shared_payload_coordinator.dart
            lib/platform/sharing/system_share_receiver.dart
            test/file_transfer_continuity_test.dart
            test/native_permission_gateway_test.dart
            test/share_ingress_test.dart
            test/structured_ingress_test.dart
            test/workmanager_scheduler_test.dart
          )
          dart format "${files[@]}"
          git diff --no-ext-diff --no-color -- "${files[@]}"
