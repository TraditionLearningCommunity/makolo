name: Temporary final Subscription transition lock fix

on:
  push:
    branches:
      - fix/post-99-main-regressions

permissions:
  contents: write

concurrency:
  group: tmp-post100-transition-lock
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-99-main-regressions
          fetch-depth: 0
      - name: Scope transition lock to canonical row
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('subscriptions/transition_services.py')
          text = path.read_text()
          old = 'SubscriptionTransition.objects.select_for_update()\n        .select_related('
          new = 'SubscriptionTransition.objects.select_for_update(of=("self",))\n        .select_related('
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one completion transition lock, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-post100-transition-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/transition_services.py
          git commit -m "fix: scope SubscriptionTransition completion lock"
          git push origin HEAD:fix/post-99-main-regressions