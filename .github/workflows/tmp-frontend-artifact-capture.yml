name: Temporary frontend artifact capture

on:
  push:
    branches:
      - feat/m8-mobile-first-mature-experience-final

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Upload generated frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: generated-frontend-bundle
          path: static/dist/makolo.js
          if-no-files-found: error
