name: Temporary frontend artifact synchronization

on:
  push:
    branches:
      - feat/m8-mobile-first-mature-experience-final

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/m8-mobile-first-mature-experience-final
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Commit synchronized bundle and remove temporary workflow
        run: |
          rm .github/workflows/tmp-frontend-artifact-capture.yml
          git add static/dist/makolo.js .github/workflows/tmp-frontend-artifact-capture.yml
          git diff --cached --exit-code && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize generated frontend bundle"
          git push origin HEAD:feat/m8-mobile-first-mature-experience-final
