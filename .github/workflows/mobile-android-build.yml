name: Mobile Android Build
run-name: "Mobile DEV APK - ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    paths:
      - "mobile/lib/**"
      - "mobile/android/**"
      - "mobile/assets/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - "mobile/.flutter-version"
      - "mobile/config/dev.json"
      - ".github/workflows/mobile-android-build.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Toolchain
        run: |
          java -version
          flutter --version
      - name: Resolve dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Validate remote DEV API
        run: |
          set -euo pipefail
          jq -e '
            .MAKOLO_ENVIRONMENT == "dev"
            and (.MAKOLO_API_BASE_URL | type == "string"
                 and test("^https://[^/]+/?$"))
            and (.MAKOLO_API_BASE_URL | test(
              "^https://(localhost|127\\.0\\.0\\.1|10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|[^/]*\\.local)([:/]|$)";
              "i"
            ) | not)
          ' config/dev.json > /dev/null
          echo "DEV build configured for a remote HTTPS API."
      - name: Build Android debug
        run: flutter build apk --debug --flavor dev --dart-define-from-file=config/dev.json
      - name: Upload DEV APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-dev-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
