name: Q4 bounded Trust lock fix

on:
  push:
    branches:
      - capital/q4-trusted-reuse-hardening
    paths:
      - .github/workflows/q4-trust-lock-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capital/q4-trusted-reuse-hardening
      - name: Bound nullable select_for_update joins to self
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("trust/services.py")
          text = path.read_text()
          replacements = {
              'VerificationClaim.objects.select_for_update().select_related("subject_space")': 'VerificationClaim.objects.select_for_update(of=("self",)).select_related("subject_space")',
              'Report.objects.select_for_update().select_related("journey", "activity", "space", "reporter")': 'Report.objects.select_for_update(of=("self",)).select_related("journey", "activity", "space", "reporter")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected Trust lock pattern not found: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit exact Trust locking fix
        run: |
          if git diff --quiet -- trust/services.py; then
            echo "No Trust lock changes needed"
            exit 0
          fi
          git config user.name "Gilbert243"
          git config user.email "gilbert.bemwiz@fitforpurpose.tech"
          git add trust/services.py
          git commit -m "Q4: fix Trust PostgreSQL nullable row locking"
          git push origin HEAD:capital/q4-trusted-reuse-hardening
