name: Security supply chain

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: security-supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-supply-chain:
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agents.txt -r requirements-dev.txt
          python -m pip check
      - name: Reject mutable GitHub Actions references
        run: python scripts/check_action_pins.py
      - name: Audit Python runtime dependencies
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-agents.txt
      - name: Bandit medium/high first-party runtime findings
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find . -type f -name '*.py' \
              ! -path './.git/*' \
              ! -path './.venv/*' \
              ! -path './node_modules/*' \
              ! -path './static/*' \
              ! -path './staticfiles/*' \
              ! -path './e2e/*' \
              ! -path './frontiere_opportunite_lab/*' \
              ! -path '*/migrations/*' \
              ! -name 'test*.py' \
              -print0
          )
          bandit -q -ll "${files[@]}"
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=high
