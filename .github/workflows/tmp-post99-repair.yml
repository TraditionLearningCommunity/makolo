name: Temporary post-99 repair

on:
  push:
    branches:
      - fix/post-99-main-regressions

permissions:
  contents: write

concurrency:
  group: tmp-post99-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-99-main-regressions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Apply root-cause fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('subscriptions/transition_services.py')
          text = path.read_text()
          old = 'Subscription.objects.select_for_update()\n        .select_related("profile", "space")'
          new = 'Subscription.objects.select_for_update(of=("self",))\n        .select_related("profile", "space")'
          if old not in text:
              raise SystemExit('Subscription lock pattern not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('services/attention_selectors.py')
          text = path.read_text()
          old = '    return queryset.distinct()\n\n\ndef manager_attention_journeys'
          new = '    return queryset.distinct().order_by()\n\n\ndef manager_attention_journeys'
          if old not in text:
              raise SystemExit('Facilitator attention return pattern not found')
          text = text.replace(old, new, 1)
          old = '        .distinct()\n    )\n\n\ndef opportunity_curator_attention'
          new = '        .distinct()\n        .order_by()\n    )\n\n\ndef opportunity_curator_attention'
          if old not in text:
              raise SystemExit('Manager attention return pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused T35 regression tests
        env:
          DJANGO_ENV: test
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
        run: python manage.py test services.test_t35_operator_web
      - name: Check migrations
        env:
          DJANGO_ENV: test
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
        run: python manage.py makemigrations --check --dry-run
      - name: Commit repair and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-post99-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/transition_services.py services/attention_selectors.py
          git commit -m "fix: restore post-99 main regressions"
          git push origin HEAD:fix/post-99-main-regressions
