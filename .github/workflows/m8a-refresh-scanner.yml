name: M8-A refresh scanner baseline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh-scanner-baseline:
    if: ${{ github.event.pull_request.number == 216 && github.event.pull_request.head.ref == 'm8/mature-home-shell' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-e2e-only-secret-key-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare deterministic E2E environment
        run: bash scripts/prepare-e2e.sh
      - name: Regenerate reviewed scanner mobile baseline
        env:
          E2E_SKIP_PREP: "1"
        run: >-
          npx playwright test e2e/specs/visual.spec.mjs
          --grep "representative mobile surfaces"
          --project=chromium-mobile
          --update-snapshots
      - name: Commit only reviewed scanner baseline
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          path="e2e/specs/visual.spec.mjs-snapshots/scanner-light-mobile-chromium-mobile-linux.png"
          test -f "$path"
          python - "$path" <<'PY'
          import sys
          from PIL import Image
          p = sys.argv[1]
          with Image.open(p) as image:
              image.verify()
          with Image.open(p) as image:
              if image.size != (390, 1719):
                  raise SystemExit(f"Unexpected scanner baseline dimensions: {image.size}")
          PY
          cp "$path" /tmp/scanner-light-mobile.png
          git fetch origin m8/mature-home-shell
          test "$(git rev-parse origin/m8/mature-home-shell)" = "$EXPECTED_HEAD_SHA"
          git checkout -B m8/mature-home-shell origin/m8/mature-home-shell
          cp /tmp/scanner-light-mobile.png "$path"
          git add "$path"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): repair scanner mobile baseline"
          git push origin HEAD:m8/mature-home-shell
