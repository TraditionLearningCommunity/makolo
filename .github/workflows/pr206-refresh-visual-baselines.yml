name: PR206 reviewed visual baseline refresh

on:
  push:
    branches:
      - feat/activity-occurrence-temporal-discovery

permissions:
  contents: write

jobs:
  refresh-reviewed-baselines:
    if: ${{ !contains(github.event.head_commit.message, '[visual-baseline]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-e2e-only-secret-key-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/activity-occurrence-temporal-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          npm ci
          npm run build
      - name: Install Playwright Chromium
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt-mirrors.txt >/dev/null
          npx playwright install --with-deps chromium
      - name: Prepare deterministic E2E environment
        run: bash scripts/prepare-e2e.sh
      - name: Refresh reviewed visual baselines
        env:
          E2E_SKIP_PREP: "1"
        run: npm run test:e2e:update-snapshots
      - name: Commit only visual baselines
        run: |
          git status --short e2e/specs/visual.spec.mjs-snapshots
          git add e2e/specs/visual.spec.mjs-snapshots
          if git diff --cached --quiet; then
            echo "No visual baseline changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh reviewed Discovery visual baselines [visual-baseline]"
          git push origin HEAD:feat/activity-occurrence-temporal-discovery
