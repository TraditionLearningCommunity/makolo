name: M8-B refresh discovery baselines

on:
  push:
    branches:
      - m8/discover-possibility-experience

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'refresh reviewed discovery visual baselines') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-e2e-only-secret-key-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8/discover-possibility-experience
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Verify committed frontend artifacts are synchronized
        run: git diff --exit-code -- package-lock.json static/dist
      - name: Install Playwright browsers
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt-mirrors.txt >/dev/null
          npx playwright install --with-deps chromium firefox
      - name: Regenerate reviewed visual baselines
        run: npm run test:e2e:update-snapshots
      - name: Commit only Discovery baselines
        run: |
          git add \
            e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png \
            e2e/specs/visual.spec.mjs-snapshots/discovery-dark-desktop-chromium-desktop-linux.png \
            e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png
          if git diff --cached --quiet; then
            echo 'No Discovery baseline changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M8-B: refresh reviewed discovery visual baselines'
          git push origin HEAD:m8/discover-possibility-experience
