name: Frontend bootstrap

on:
  push:
    branches:
      - feat/frontend-production-hardening

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-production-hardening

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Generate lockfile when needed
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Install from lockfile and build
        run: |
          npm ci
          npm run build

      - name: Commit generated release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json static/dist
          if git diff --cached --quiet; then
            echo "Frontend artifacts already synchronized."
          else
            git commit -m "build: lock frontend dependencies and artifacts"
            git push origin HEAD:feat/frontend-production-hardening
          fi
