name: Frontend bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-production-hardening

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install and rebuild locked assets
        run: |
          npm ci
          npm run build

      - name: Commit synchronized dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/dist
          if git diff --cached --quiet; then
            echo "Frontend dist already synchronized."
          else
            git commit -m "build: refresh frontend release artifacts"
            git push origin HEAD:feat/frontend-production-hardening
          fi
