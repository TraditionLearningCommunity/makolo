name: Mobile Visual Golden Regression

on:
  pull_request:
    paths:
      - "mobile/assets/**"
      - "mobile/lib/design/**"
      - "mobile/lib/**/design/**"
      - "mobile/lib/**/widgets/**"
      - "mobile/lib/app/app_shell.dart"
      - "mobile/lib/app/brand_moment.dart"
      - "mobile/lib/app/mark_screen.dart"
      - "mobile/test/visual_regression_test.dart"
      - "mobile/test/goldens/**"
      - "mobile/test/goldens.sha256"
      - ".github/workflows/mobile-visual-golden-generate.yml"

permissions:
  contents: read

jobs:
  visual-goldens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate deterministic visual references
        run: flutter test --update-goldens test/visual_regression_test.dart
      - name: Verify approved visual baselines
        run: sha256sum -c test/goldens.sha256
      - name: Re-run golden assertions
        run: flutter test test/visual_regression_test.dart
      - name: Publish visual references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-mobile-visual-goldens
          path: mobile/test/goldens/*.png
          if-no-files-found: error
          retention-days: 7
