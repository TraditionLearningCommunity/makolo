name: Mobile Visual Golden Generate

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-visual-golden-generate.yml"

permissions:
  contents: read

jobs:
  generate-goldens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate visual references
        run: flutter test --update-goldens test/visual_regression_test.dart
      - name: Publish visual references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makolo-mobile-visual-goldens
          path: mobile/test/goldens/*.png
          if-no-files-found: error
          retention-days: 7
