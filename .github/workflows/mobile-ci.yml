name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Toolchain
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Verify generated code is committed
        working-directory: .
        run: git diff --exit-code -- mobile/lib mobile/test
      - name: Format mobile sources
        run: dart format lib test
      - name: Publish formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-formatted-sources-${{ github.sha }}
          path: |
            mobile/lib
            mobile/test
          if-no-files-found: error
          retention-days: 1
      - name: Commit Dart formatting
        working-directory: .
        shell: bash
        run: |
          if ! git diff --quiet -- mobile/lib mobile/test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/lib mobile/test
            git commit -m "style(mobile): apply Dart formatter"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --exclude-tags golden
