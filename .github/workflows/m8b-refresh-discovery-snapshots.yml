name: M8-B refresh reviewed Discovery snapshots

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'TraditionLearningCommunity/makolo' && github.head_ref == 'm8/discover-possibility-experience'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out M8-B head
        uses: actions/checkout@v4
        with:
          ref: m8/discover-possibility-experience
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Refresh reviewed Discovery visual baselines
        run: |
          bash scripts/run-e2e.sh e2e/specs/visual.spec.mjs --update-snapshots --timeout=120000 --project=chromium-desktop --project=chromium-mobile

      - name: Keep only baselines that fail the release gate
        run: |
          git restore --source=HEAD -- \
            e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-dark-desktop-chromium-desktop-linux.png \
            e2e/specs/visual.spec.mjs-snapshots/discovery-nearby-light-desktop-chromium-desktop-linux.png

      - name: Verify snapshot scope
        run: |
          expected=$(printf '%s\n' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-dark-desktop-chromium-desktop-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png' \
            'e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png' | sort)
          actual=$(git diff --name-only | sort)
          printf 'Expected changes:\n%s\nActual changes:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Commit reviewed baselines and remove helper workflow
        run: |
          git add \
            e2e/specs/visual.spec.mjs-snapshots/discovery-dark-desktop-chromium-desktop-linux.png \
            e2e/specs/visual.spec.mjs-snapshots/discovery-light-desktop-chromium-desktop-linux.png \
            e2e/specs/visual.spec.mjs-snapshots/discovery-light-mobile-chromium-mobile-linux.png
          git rm .github/workflows/m8b-refresh-discovery-snapshots.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M8-B: refresh reviewed Discovery visual baselines'
          git push origin HEAD:m8/discover-possibility-experience
