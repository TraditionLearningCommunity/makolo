name: Subscriptions

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "subscriptions/**"
      - "requirements/**"
      - "accounts/**"
      - "organizations/**"
      - "activities/**"
      - "authorization/**"
      - "payments/**"
      - "test_support/**"
      - "config/settings.py"
      - "docs/architecture/subscriptions-*.md"
      - ".github/workflows/subscriptions.yml"
  push:
    branches:
      - main
    paths:
      - "subscriptions/**"
      - "requirements/**"
      - "accounts/**"
      - "organizations/**"
      - "activities/**"
      - "authorization/**"
      - "payments/**"
      - "test_support/**"
      - "config/settings.py"
      - "docs/architecture/subscriptions-*.md"
      - ".github/workflows/subscriptions.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-subscriptions-fast-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run fast Subscription checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test subscriptions.tests subscriptions.test_s3_eligibility subscriptions.test_s3_requirement_validation subscriptions.test_s4_transitions subscriptions.test_s4_validation subscriptions.test_s4_payment_bridge subscriptions.test_s4_preview

  postgresql:
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_subscriptions_ci
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_subscriptions_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-subscriptions-only-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_subscriptions_ci
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Django checks and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run Subscription catalogue regressions
        run: python manage.py test subscriptions.tests
      - name: Run Subscription S2 runtime regressions
        run: python manage.py test subscriptions.test_s2_runtime subscriptions.test_s2_grant_regressions
      - name: Run Subscription S3 eligibility regressions
        run: python manage.py test subscriptions.test_s3_eligibility subscriptions.test_s3_requirement_validation requirements
      - name: Run Subscription S4 transition regressions
        run: python manage.py test subscriptions.test_s4_transitions subscriptions.test_s4_validation subscriptions.test_s4_payment_bridge subscriptions.test_s4_preview
      - name: Run Subscription PostgreSQL concurrency regressions
        run: python manage.py test subscriptions.test_s2_concurrency subscriptions.test_s4_concurrency
