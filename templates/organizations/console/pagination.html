{% if page_obj and page_obj.paginator.num_pages > 1 %}<nav class="mt-6 flex items-center justify-between text-sm" aria-label="Pagination"><div>{% if page_obj.has_previous %}<a class="font-bold text-indigo-500" href="?page={{ page_obj.previous_page_number }}">← Précédent</a>{% endif %}</div><span class="text-zinc-500">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_next %}<a class="font-bold text-indigo-500" href="?page={{ page_obj.next_page_number }}">Suivant →</a>{% endif %}</div></nav>{% endif %}
