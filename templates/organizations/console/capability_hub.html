{% extends 'organizations/console/base.html' %}
{% block console_content %}
<section class="mk-panel p-5 sm:p-6">
  <div class="max-w-3xl">
    <span class="mk-kicker">Espace · {{ console_page_title }}</span>
    <h2 class="mt-3 text-2xl font-extrabold tracking-[-.03em]">{{ console_page_title }}</h2>
    <p class="mt-3 text-sm leading-6" style="color:var(--mk-muted)">{{ capability_description }}</p>
  </div>
  <div class="mt-6 grid gap-4 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-center">
    <div class="rounded-2xl border p-4" style="border-color:var(--mk-border);background:var(--mk-surface-soft)">
      <p class="font-bold">Disponible dans cet Espace</p>
      <p class="mt-1 text-sm" style="color:var(--mk-muted)">Vous avez accès à cet outil dans cet espace.</p>
    </div>
    <a href="{{ capability_destination_url }}" class="mk-action-button" data-variant="primary">{{ capability_action_label }}</a>
  </div>
</section>
{% endblock %}
