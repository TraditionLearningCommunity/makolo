{% load static %}
<!DOCTYPE html>
<html lang="fr" class="h-full"{% if request.user.is_authenticated %} data-theme-preference="{{ request.user.profile.theme|default:'system' }}"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2B176E">
    <title>{% block title %}Makolo{% endblock %}</title>
    {% include 'partials/brand_head.html' %}
    <script src="{% static 'js/theme-preference.js' %}"></script>
    <link rel="stylesheet" href="{% static 'dist/makolo.css' %}">
    <link rel="stylesheet" href="{% static 'css/makolo-ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/makolo-compat.css' %}">
    <link rel="stylesheet" href="{% static 'css/makolo-brand.css' %}">
    <link rel="stylesheet" href="{% static 'css/makolo-brand-assets.css' %}">
    <link rel="stylesheet" href="{% static 'css/makolo-a11y.css' %}">
    <script defer src="{% static 'dist/makolo.js' %}"></script>
    <script defer src="{% static 'js/auth-entry.js' %}"></script>
</head>
<body class="min-h-screen">
    <a href="#main-content" class="fixed left-4 top-2 z-[100] -translate-y-16 rounded-xl bg-indigo-700 px-4 py-2 text-sm font-bold text-white transition focus:translate-y-0">Aller au contenu principal</a>
    {% include 'partials/messages.html' %}
    <main id="main-content" tabindex="-1" class="min-h-screen">
        <section class="flex min-h-screen items-center justify-center px-5 py-10 sm:px-8 lg:px-12">
            <div class="w-full max-w-[460px]">
                <a href="{% url 'core:home' %}" class="mb-8 flex items-center gap-3" aria-label="Retour à Makolo">
                    <img src="{% static 'brand/makolo-mark-gradient.svg' %}" alt="" class="mk-brand-symbol mk-brand-symbol-light" width="44" height="30">
                    <img src="{% static 'brand/makolo-mark-white.svg' %}" alt="" class="mk-brand-symbol mk-brand-symbol-dark" width="44" height="30">
                    <div><p class="mk-brand-wordmark text-sm">Makolo</p><p class="text-[10px] uppercase tracking-[.12em]" style="color:var(--mk-subtle)">Makolo marche pour vous.</p></div>
                </a>
                <div class="mk-auth-card p-6 sm:p-8">{% block content %}{% endblock %}</div>
                <p class="mt-6 text-center text-[11px]" style="color:var(--mk-subtle)">Makolo marche pour vous.</p>
            </div>
        </section>
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
