{% comment %}
Exact "available/saved" orbit geometry from
mobile/lib/presentation/possibilities/discovery_save_icon.dart.
This is Discover's save language reused in Mark, not a generic bookmark.
{% endcomment %}
<button type="button" class="mk-mark-save" data-mk-mark-save
  title="Enregistrer" aria-label="Enregistrer">
  <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"
    data-mk-orbit-available fill="none" stroke="currentColor"
    stroke-linecap="round">
    <path d="M5.2 17.6A8.7 8.7 0 0 1 16.9 5.1" stroke-width="2.2"/>
    <path d="M18.4 7.2a8.6 8.6 0 0 1 .2 7.4" stroke-width="2.2"/>
    <circle cx="19.3" cy="17.6" r="1.45" fill="currentColor" stroke="none"/>
  </svg>
  <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"
    data-mk-orbit-saved hidden fill="none" stroke="currentColor"
    stroke-linecap="round">
    <path d="M5.6 17.2a8.2 8.2 0 1 1 12.9-1.4" stroke-width="2.4"/>
    <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
    <circle cx="19.2" cy="17.5" r="1.55" fill="currentColor" stroke="none"/>
  </svg>
</button>
