{% comment %}
Mark's Web composer is text-first. Native files are prepared locally; only
PersonalAsset's existing form can accept an explicitly confirmed document.
No attachment or guessed entitlement is submitted to the Mark text endpoint.
{% endcomment %}
<section class="mk-mark-support" data-mk-mark-support aria-label="Préparer la demande">
  <div class="mk-mark-tools" role="group" aria-label="Outils de saisie">
    <button type="button" class="mk-mark-icon" data-mk-mark-attach-open
      title="Ajouter une pièce" aria-label="Ajouter une pièce" aria-expanded="false">
      <i data-lucide="plus" aria-hidden="true"></i>
    </button>
    <button type="button" class="mk-mark-icon" data-mk-mark-voice hidden
      title="Dicter" aria-label="Dicter">
      <i data-lucide="mic" aria-hidden="true"></i>
    </button>
  </div>
  <div class="mk-mark-attach-menu" data-mk-mark-attach-menu hidden role="group"
    aria-label="Choisir une pièce">
    <button type="button" data-mk-mark-photo-open>
      <i data-lucide="camera" aria-hidden="true"></i><span>Appareil photo</span>
    </button>
    <button type="button" data-mk-mark-gallery-open>
      <i data-lucide="images" aria-hidden="true"></i><span>Photos</span>
    </button>
    <button type="button" data-mk-mark-files-open>
      <i data-lucide="paperclip" aria-hidden="true"></i><span>Fichiers</span>
    </button>
  </div>
  <input id="mark-files-{{ mark_scope|default:'personal' }}" type="file"
    data-mk-mark-files hidden multiple>
  <input id="mark-photo-{{ mark_scope|default:'personal' }}" type="file" data-mk-mark-photo hidden
    capture="environment" accept="image/*">
  <input id="mark-gallery-{{ mark_scope|default:'personal' }}" type="file" data-mk-mark-gallery hidden
    accept="image/*" multiple>
  <div class="mk-mark-dictation" data-mk-mark-dictation hidden
    role="group" aria-label="Enregistrement vocal">
    <i data-lucide="audio-lines" aria-hidden="true"></i>
    <span data-mk-mark-speech-status role="status">Audio · 00:00</span>
    <button type="button" data-mk-mark-speech-pause
      title="Pause" aria-label="Pause">
      <i data-lucide="pause" aria-hidden="true"></i>
    </button>
    <button type="button" data-mk-mark-speech-stop
      title="Terminer" aria-label="Terminer">
      <i data-lucide="square" aria-hidden="true"></i>
    </button>
    <button type="button" data-mk-mark-speech-use hidden
      title="Ajouter l'audio" aria-label="Ajouter l'audio">
      <i data-lucide="audio-lines" aria-hidden="true"></i>
    </button>
    <button type="button" data-mk-mark-speech-cancel
      title="Annuler" aria-label="Annuler">
      <i data-lucide="x" aria-hidden="true"></i>
    </button>
  </div>
  <div class="mk-mark-references" data-mk-mark-references aria-live="polite"></div>
  <dialog class="mk-mark-preview" data-mk-mark-preview aria-label="Aperçu d'une pièce">
    <div class="mk-mark-preview-content" data-mk-mark-preview-body></div>
    <button type="button" class="mk-action-button" data-variant="secondary"
      data-mk-mark-preview-close>Fermer</button>
  </dialog>
  <p class="mk-mark-error" data-mk-mark-feedback role="status" aria-live="polite" hidden></p>
</section>
<div data-mk-mark-text-consent class="mk-mark-inline-choice" hidden>
  <i data-lucide="info" aria-hidden="true"></i>
  <span>Pièces non incluses</span>
  <button type="button" data-mk-mark-confirm-text title="Envoyer le texte seul">
    Texte seul
  </button>
  <button type="button" data-mk-mark-keep-draft
    aria-label="Revenir à la préparation" title="Revenir">
    <i data-lucide="x" aria-hidden="true"></i>
  </button>
</div>
