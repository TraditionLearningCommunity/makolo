{# Presentation-only Passport. The owner chooses visibility and destination. #}
<div class="mk-identity-passport-gateway">
  <span class="mk-identity-passport-symbol" aria-hidden="true"><i data-lucide="badge-check"></i></span>
  <div class="mk-identity-passport-copy">
    {% if eyebrow %}<span class="mk-identity-passport-eyebrow">{{ eyebrow }}</span>{% endif %}
    {% if heading_level == 'h3' %}<h3{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ title }}</h3>{% else %}<strong{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ title }}</strong>{% endif %}
    <span>{{ subtitle }}</span>
  </div>
  {% if href %}
    <a class="mk-identity-passport-action" href="{{ href }}" aria-label="{{ action_label }}" title="{{ action_label }}"><i data-lucide="arrow-right" aria-hidden="true"></i></a>
  {% endif %}
</div>
