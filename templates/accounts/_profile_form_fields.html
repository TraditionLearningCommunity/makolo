{% for field in form %}
<div class="{% if field.name == 'bio' or field.name == 'address' or field.name == 'avatar' %}md:col-span-2{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="flex items-start gap-3 rounded-2xl border p-4" style="border-color:var(--mk-border)">
        {{ field }}
        <span>
            <span class="block text-sm font-bold">{{ field.label }}</span>
            {% if field.help_text %}<span class="mt-1 block text-xs leading-5" style="color:var(--mk-muted)">{{ field.help_text }}</span>{% endif %}
        </span>
    </label>
    {% else %}
    <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-bold">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs leading-5" style="color:var(--mk-muted)">{{ field.help_text }}</p>{% endif %}
    {% endif %}
    {% for error in field.errors %}<p class="mt-1 text-xs font-semibold text-red-600">{{ error }}</p>{% endfor %}
</div>
{% endfor %}
