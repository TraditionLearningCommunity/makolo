{% extends 'base/app.html' %}
{% block title %}Modifier {{ group.name }} — Makolo{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl space-y-6"><div><a href="{% url 'groups:detail' group.slug %}" class="text-sm font-bold" style="color:var(--mk-primary)">← {{ group.name }}</a><h1 class="mt-3 text-2xl font-black" style="color:var(--mk-text)">Informations du Groupe</h1></div><form method="post" class="mk-card space-y-5 p-6">{% csrf_token %}{% include 'groups/_form_fields.html' %}<button class="mk-btn mk-btn-primary" type="submit">Enregistrer</button></form></div>
{% endblock %}
