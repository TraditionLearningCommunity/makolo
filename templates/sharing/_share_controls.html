<div class="mk-panel p-4" data-makolo-share data-create-url="{{ create_url }}" data-share-title="{{ share_title }}" data-share-text="{{ share_text|default:'Un contenu Makolo vous a été partagé.' }}">
  <form class="hidden" aria-hidden="true">{% csrf_token %}{% if share_intent %}<input type="hidden" name="intent" value="{{ share_intent }}">{% endif %}</form>
  <details>
    <summary class="mk-btn mk-btn-secondary cursor-pointer list-none"><span aria-hidden="true">↗</span> Partager</summary>
    <div class="mt-4 flex flex-wrap gap-2" role="group" aria-label="Options de partage">
      <button type="button" class="mk-btn mk-btn-primary" data-share-native>Partager avec…</button>
      <button type="button" class="mk-btn mk-btn-secondary" data-share-copy>Copier le lien</button>
      <button type="button" class="mk-btn mk-btn-ghost" data-share-qr-button>Afficher le QR</button>
    </div>
    <p class="mt-3 text-sm font-semibold" style="color:var(--mk-muted)" role="status" aria-live="polite" data-share-feedback></p>
    <div class="mt-4 hidden" data-share-qr-panel>
      <img class="mx-auto h-48 w-48 rounded-2xl bg-white p-2" data-share-qr alt="QR du lien de partage Makolo">
      <p class="mt-2 text-center text-xs" style="color:var(--mk-muted)">Ce QR contient uniquement le lien de partage Makolo.</p>
    </div>
  </details>
</div>
